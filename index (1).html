<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tanabi Sport | Fotografía y video deportivo</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tanabi Sport">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#141414">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F3F1; --surface:#FFFFFF; --ink:#141414; --muted:#5E5E5A; --line:#D9D9D4;
  --turf:#141414; --turf-ink:#FFFFFF; --amber:#F0B429; --amber-ink:#141414; --alert:#B3361B; --ok:#1F7A4A;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121212; --surface:#1C1C1C; --ink:#F1F1EE; --muted:#A3A39E; --line:#333330;
    --turf:#F1F1EE; --turf-ink:#121212; --alert:#FF8A6B; --ok:#6FD39A;
  }
}
:root[data-theme="dark"]{
  --bg:#121212; --surface:#1C1C1C; --ink:#F1F1EE; --muted:#A3A39E; --line:#333330;
  --turf:#F1F1EE; --turf-ink:#121212; --alert:#FF8A6B; --ok:#6FD39A;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.5}
h1,h2,h3{font-family:"Bricolage Grotesque","Instrument Sans",system-ui,sans-serif;margin:0;line-height:1.05;letter-spacing:-.02em}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding:0 18px}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 0;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center}
.logo{height:44px;width:auto;border-radius:8px;display:block}
.who{font-size:.85rem;color:var(--muted);margin-right:8px}
.btn{border:2px solid var(--ink);background:transparent;border-radius:999px;padding:8px 16px;font-weight:600;min-height:44px}
.btn.primary{background:var(--turf);border-color:var(--turf);color:var(--turf-ink)}
.btn.amber{background:var(--amber);border-color:var(--amber);color:var(--amber-ink)}
.btn.small{padding:4px 12px;min-height:36px;font-size:.9rem}
.btn.danger{border-color:var(--alert);color:var(--alert)}
.hero{padding:28px 0 12px}
.hero h1{font-size:clamp(2.6rem,11vw,6rem);font-weight:800;max-width:11ch}
.hero p{max-width:46ch;color:var(--muted);margin:16px 0 22px;font-size:1.05rem}
.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:14px 0 36px}
@media(min-width:720px){.gallery{grid-template-columns:repeat(4,1fr)}}
.tile{position:relative;aspect-ratio:3/4;border-radius:6px;overflow:hidden;background:#222;display:flex;align-items:flex-end;padding:10px;color:#fff;font-weight:600;font-size:.9rem}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile span{position:relative;background:rgba(0,0,0,.45);padding:2px 8px;border-radius:4px}
.tile.t1{background:linear-gradient(160deg,#2B2B2B,#0F0F0F)}
.tile.t2{background:linear-gradient(200deg,#F0B429,#B27C0A);color:#141414}
.tile.t3{background:linear-gradient(140deg,#4A4A47,#1A1A19)}
.tile.t4{background:linear-gradient(180deg,#5A5A56,#232322)}
.tile.tall{grid-row:span 2;aspect-ratio:auto}
.tile::before,.tile::after{content:"";position:absolute;width:18px;height:18px;border:2px solid rgba(255,255,255,.75)}
.tile::before{top:10px;left:10px;border-right:0;border-bottom:0}
.tile::after{top:10px;right:10px;border-left:0;border-bottom:0}
.live{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:36px;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--muted);margin-right:8px}
.dot.on{background:var(--alert)}
.login{max-width:380px;margin:40px auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px}
.login h2{font-size:1.8rem;margin-bottom:6px}
label{display:block;font-weight:600;font-size:.9rem;margin:12px 0 4px}
input,select{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);min-height:44px}
input[type="checkbox"]{width:22px;height:22px;min-height:0;padding:0;accent-color:var(--turf)}
input:disabled,select:disabled{opacity:.55}
.chk{display:flex;align-items:center;gap:10px;margin:12px 0 4px;font-weight:600}
.chk input{flex:none}
.hint{color:var(--muted);font-size:.85rem;margin-top:10px}
.err{color:var(--alert);font-weight:600;margin-top:8px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 14px;border-bottom:1px solid var(--line);margin-bottom:18px}
.tab{border:0;background:transparent;padding:8px 14px;border-radius:999px;font-weight:600;white-space:nowrap;color:var(--muted);min-height:40px}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.grid2{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:760px){.grid2{grid-template-columns:1fr 1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
.grid2 .card{margin-bottom:0}
.card h3{font-size:1.3rem;margin-bottom:10px}
.num{font-family:"Bricolage Grotesque",sans-serif;font-size:2.4rem;font-weight:800}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 140px}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.8rem;font-weight:600;background:var(--line);margin:2px 4px 2px 0}
.badge.warn{background:var(--amber);color:var(--amber-ink)}
.badge.bad{background:var(--alert);color:#fff}
.badge.good{background:var(--ok);color:var(--bg)}
.muted{color:var(--muted)}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-head h3{margin:0;text-transform:capitalize}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{text-align:center;font-size:.8rem;font-weight:600;color:var(--muted);padding:4px 0}
.day{aspect-ratio:1;border:1px solid var(--line);background:var(--surface);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0;font-weight:600;min-height:44px}
.day.empty{border:0;background:transparent}
.day.today{border-color:var(--turf);border-width:2px}
.day.sel{background:var(--turf);color:var(--turf-ink);border-color:var(--turf)}
.day small{font-size:.7rem;font-weight:600;color:var(--amber-ink);background:var(--amber);border-radius:999px;padding:0 6px}
.match{border-top:1px solid var(--line);padding:14px 0}
.match:first-child{border-top:0}
.match h3{font-size:1.15rem}
.match .meta{color:var(--muted);font-size:.9rem;margin:4px 0 10px}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:10px 0 4px}
.steps i{height:8px;border-radius:4px;background:var(--line);display:block}
.steps i.on{background:var(--ok)}
.steps i.cur{background:var(--amber)}
.steplbl{font-size:.8rem;color:var(--muted);display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.loc{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.loc:first-child{border-top:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:2px 4px 2px 12px;font-size:.9rem}
.chipx{border:0;background:transparent;color:var(--muted);font-size:1.1rem;line-height:1;min-width:32px;min-height:32px;border-radius:999px;cursor:pointer}
a{color:var(--turf);font-weight:600}
.note{background:var(--surface);border-left:4px solid var(--amber);padding:10px 14px;border-radius:6px;font-size:.9rem;margin:14px 0}
.total{font-weight:700;margin-top:10px}
.pl{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px dashed var(--line)}
.pl:first-of-type{border-top:0}
details summary{padding:6px 0}
textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);min-height:120px;font:inherit;color:inherit}
footer{padding:30px 0;color:var(--muted);font-size:.85rem}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

function catFind(k,name){var n=normK(name);if(!n)return null;var l=catList(k);for(var i=0;i<l.length;i++){if(normK(l[i])===n)return l[i];}return null;}
function catOpts(k,ph){return '<option value="">'+esc(ph)+'</option>'+catList(k).map(function(n){return '<option value="'+esc(n)+'">'+esc(n)+'</option>';}).join("");}
function parseCsv(txt){
  txt=String(txt).replace(/^\uFEFF/,"");
  var first=txt.split(/\r?\n/)[0]||"";
  var dl=(first.indexOf(";")>=0&&first.indexOf(",")<0)?";":((first.indexOf("\t")>=0&&first.indexOf(",")<0)?"\t":",");
  var rows=[],row=[],cur="",q=false,i,ch;
  for(i=0;i<txt.length;i++){
    ch=txt.charAt(i);
    if(q){if(ch==='"'){if(txt.charAt(i+1)==='"'){cur+='"';i++;}else q=false;}else cur+=ch;}
    else if(ch==='"')q=true;
    else if(ch===dl){row.push(cur);cur="";}
    else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&txt.charAt(i+1)==="\n")i++;row.push(cur);cur="";rows.push(row);row=[];}
    else cur+=ch;
  }
  if(cur!==""||row.length){row.push(cur);rows.push(row);}
  return rows;
}
function importCatalogCsv(txt){
  var rows=parseCsv(txt);
  if(rows.length<2)return {err:"El archivo está vacío."};
  var h=rows[0].map(normK),ie=-1,ic=-1;
  h.forEach(function(x,i){if(ie<0&&x.indexOf("equipo")===0)ie=i;if(ic<0&&x.indexOf("categoria")===0)ic=i;});
  if(ie<0&&ic<0)return {err:'No encontré las columnas "Equipos" y "Categoria" en la primera fila.'};
  catEnsure();
  var add={teams:0,cats:0},dup=0;
  function put(k,v){v=String(v||"").replace(/\s+/g," ").trim();if(!v)return;if(catFind(k,v)){dup++;return;}S.catalog[k].push(v);add[k]++;}
  rows.slice(1).forEach(function(r){if(ie>=0)put("teams",r[ie]);if(ic>=0)put("cats",r[ic]);});
  return {add:add,dup:dup};
}
function catalogCard(){
  function chips(k){var l=catList(k);return l.length?'<div class="chips">'+l.map(function(n,i){return '<span class="chip">'+esc(n)+'<button type="button" class="chipx" data-x="catDel" data-k="'+k+'" data-i="'+i+'" aria-label="Quitar '+esc(n)+'">×</button></span>';}).join("")+'</div>':'<p class="muted">Aún no hay elementos.</p>';}
  function adder(k,lab,ph,btn){return '<div class="row" style="margin-top:10px;align-items:end"><div><label for="cat_'+k+'">'+lab+'</label><input id="cat_'+k+'" placeholder="'+ph+'"></div><div style="flex:0 0 auto"><button class="btn small" data-x="catAdd" data-k="'+k+'">'+btn+'</button></div></div>';}
  return '<div class="card"><h3>Equipos y categorías</h3><p class="muted" style="margin-top:0">Son las listas que se usan al subir partidos. Importa un CSV con las columnas <b>Equipos</b> y <b>Categoria</b>: los nombres nuevos se agregan y los repetidos se omiten.</p>'+
  '<label for="catcsv">Importar CSV</label><input id="catcsv" type="file" accept=".csv,text/csv,text/plain">'+
  (S.catMsg?'<div class="hint" role="status">'+esc(S.catMsg)+'</div>':'')+
  '<h3 style="margin-top:18px">Equipos ('+catList("teams").length+')</h3>'+chips("teams")+adder("teams","Nuevo equipo","Nombre del equipo","Agregar equipo")+
  '<h3 style="margin-top:18px">Categorías ('+catList("cats").length+')</h3>'+chips("cats")+adder("cats","Nueva categoría","Nombre de la categoría","Agregar categoría")+
  '<div class="hint">Quitar un nombre de la lista no cambia los partidos que ya existen.</div></div>';
}
document.addEventListener("change",function(e){
  var t=e.target;
  if(!t||t.id!=="catcsv"||!isAdmin())return;
  var f=t.files&&t.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    var res=importCatalogCsv(String(r.result||""));
    if(res.err){S.catMsg=res.err;}
    else{S.catMsg="Importado: "+res.add.teams+" equipo(s) y "+res.add.cats+" categoría(s) nuevos"+(res.dup?" ("+res.dup+" ya estaban en la lista).":".");if(res.add.teams||res.add.cats)save();}
    render();
  };
  r.onerror=function(){S.catMsg="No pude leer el archivo.";render();};
  r.readAsText(f);
});

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function pad(n){return n<10?"0"+n:""+n;}
function ymd(y,m,d){return y+"-"+pad(m+1)+"-"+pad(d);}
function todayStr(){var t=new Date();return ymd(t.getFullYear(),t.getMonth(),t.getDate());}
function fmtDate(s){var p=s.split("-");return parseInt(p[2],10)+" de "+MONTHS[parseInt(p[1],10)-1];}
function money(n){return "$"+(Number(n)||0).toLocaleString("es-MX");}
function me(){return S.users.filter(function(u){return u.id===S.meId;})[0]||null;}
function isAdmin(){var u=me();return !!u&&u.role==="admin";}
function userName(id){var u=S.users.filter(function(x){return x.id===id;})[0];return u?u.name:"";}
function byRole(r){return S.users.filter(function(u){return u.role===r;});}
function cmp(a,b){return (a.date+a.time)<(b.date+b.time)?-1:1;}
function stageIdx(s){for(var i=0;i<STAGES.length;i++)if(STAGES[i][0]===s)return i;return -1;}
function total(c){return c?(Number(c.players)||0)*(Number(c.price)||0):0;}
function mapsLink(q){return "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q);}
function isMine(m){var u=me();return !!u&&(m.f1===u.id||m.f2===u.id);}

function pd(x){var p=x.split("-");return new Date(+p[0],+p[1]-1,+p[2],12);}
function dstr(d){return ymd(d.getFullYear(),d.getMonth(),d.getDate());}
function addDays(x,n){var d=pd(x);d.setDate(d.getDate()+n);return dstr(d);}
function mondayOf(x){var d=pd(x),w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return dstr(d);}
function weekLabel(w){return "Semana del "+fmtDate(w)+" al "+fmtDate(addDays(w,6));}
function rateFor(kind,n){var t=S.rates[kind];for(var i=0;i<t.length;i++){if(n>=t[i][0]&&n<=t[i][1])return t[i][2];}return 0;}
function tramoLabel(kind,n){var t=S.rates[kind];for(var i=0;i<t.length;i++){if(n>=t[i][0]&&n<=t[i][1])return t[i][1]>=9999?t[i][0]+" o más":t[i][0]+" a "+t[i][1];}return "";}
function playersFor(m,uid){
  if(!m.cov)return 0;
  var ids=[];[m.f1,m.f2].forEach(function(x){if(x&&ids.indexOf(x)<0)ids.push(x);});
  if(ids.indexOf(uid)<0)return 0;
  if(ids.length===1)return Number(m.cov.players)||0;
  return Number(uid===m.f1?m.cov.p1:m.cov.p2)||0;
}
function calcPay(u,week){
  var out={lines:[],skipped:[],notes:[],total:0,rateNote:""};
  var inWeek=S.matches.filter(function(m){return m.cov&&mondayOf(m.date)===week;}).sort(cmp);
  var kind=payKind(u,inWeek);
  if(kind==="foto"){
    inWeek.forEach(function(m){
      if(m.f1!==u.id&&m.f2!==u.id)return;
      var n=playersFor(m,u.id);
      if(m.f1&&m.f2&&m.f1!==m.f2&&!(Number(m.cov.p1)||0)&&!(Number(m.cov.p2)||0))out.notes.push("Falta repartir los jugadores entre fotógrafos en "+m.teams+".");
      if(!n)return;
      var r=rateFor("foto",n);
      out.lines.push({mid:m.id,label:m.teams,date:m.date,players:n,tramo:tramoLabel("foto",n),rate:r,amount:n*r});
    });
  }else if(kind==="ed"){
    var inc=[],tot=0;
    inWeek.forEach(function(m){
      if(m.ed!==u.id&&m.edBy!==u.id&&!(!m.ed&&!m.edBy&&byRole("editora").length===1))return;
      if(m.stage==="listos"){inc.push(m);tot+=Number(m.cov.players)||0;}
      else{var si=stageIdx(m.stage);out.skipped.push(m.teams+" ("+(si<0?"sin iniciar":STAGES[si][1])+", "+(Number(m.cov.players)||0)+" jugadores)");}
    });
    var sinEd=inWeek.filter(function(m){return !m.ed&&!m.edBy&&byRole("editora").length>1;}).length;
    if(sinEd)out.notes.push("Hay "+sinEd+" partido(s) de la semana sin editora asignada. Asígnala en Partidos o espera a que la editora cambie su proceso.");
    var r=rateFor("ed",tot);
    if(tot)out.rateNote="Total de la semana: "+tot+" jugadores editados, tramo "+tramoLabel("ed",tot)+", "+money(r)+" por jugador";
    inc.forEach(function(m){var n=Number(m.cov.players)||0;out.lines.push({mid:m.id,label:m.teams,date:m.date,players:n,tramo:tramoLabel("ed",tot),rate:r,amount:n*r});});
  }
  out.lines.forEach(function(l){out.total+=l.amount;});
  addExtras(u,week,out);
  return out;
}
function payKey(uid,w){return uid+"|"+w;}
function snap(u,w,status){
  var c=calcPay(u,w);
  S.pays[payKey(u.id,w)]={status:status||"aprobado",lines:c.lines,total:c.total,bonus:c.bonus,reimb:c.reimb,ded:c.ded,net:c.net,rateNote:c.rateNote,comment:"",method:"",paidAt:""};
}
function payBadge(st,adm){
  var a={aprobado:["warn","Enviado, esperando respuesta"],aceptado:["good","Aceptado, falta pagar"],revision:["bad","Pidió revisión"],pagado:["good","Pagado"]};
  var w={aprobado:["warn","Por revisar"],aceptado:["good","Aceptado"],revision:["bad","Revisión pedida"],pagado:["good","Pagado"]};
  var x=(adm?a:w)[st]||["","—"];
  return '<span class="badge '+x[0]+'">'+x[1]+'</span>';
}
function lineHtml(l){
  return '<div class="pl"><span>'+esc(l.label)+' <span class="muted">· '+fmtDate(l.date)+'</span><br><span class="muted">'+l.players+' jugadores × '+money(l.rate)+(l.tramo?' (tramo '+esc(l.tramo)+')':'')+'</span></span><strong>'+money(l.amount)+'</strong></div>';
}

function staffOpts(role,cur,dis){
  var o='<option value="">Sin asignar</option>';
  byRole(role).forEach(function(u){o+='<option value="'+u.id+'"'+(cur===u.id?" selected":"")+'>'+esc(u.name)+'</option>';});
  if(cur&&!byRole(role).some(function(x){return x.id===cur;})){var cu=byId(S.users,cur);o+='<option value="'+cur+'" selected>'+esc(cu?cu.name+" (cuenta no activa)":"Cuenta eliminada")+'</option>';}
  return o;
}
function conflicts(m){
  var out=[];
  S.matches.forEach(function(o){
    if(o.id!==m.id&&o.date===m.date&&o.time===m.time){
      ["f1","f2"].forEach(function(k){
        if(m[k]&&(o.f1===m[k]||o.f2===m[k])&&out.indexOf(userName(m[k]))<0)out.push(userName(m[k]));
      });
    }
  });
  if(m.f1&&m.f1===m.f2)out.push(userName(m.f1)+" (repetido)");
  return out;
}
function status(m){
  var c=conflicts(m);
  if(c.length)return '<span class="badge bad">Choque: '+esc(c.join(", "))+'</span>';
  if(!m.f1&&!m.f2)return '<span class="badge warn">Sin fotógrafo</span>';
  if(!edOk(m))return '<span class="badge warn">Sin editora</span>';
  return '<span class="badge good">Asignado</span>';
}
function stageBadge(m){
  var i=stageIdx(m.stage);
  return i<0?'<span class="badge">Proceso sin iniciar</span>':'<span class="badge '+(i===4?"good":"warn")+'">'+STAGES[i][1]+'</span>';
}
function stepsHtml(m){
  var cur=stageIdx(m.stage),h='<div class="steps" aria-hidden="true">',l='<div class="steplbl">';
  STAGES.forEach(function(s,i){h+='<i class="'+(i<cur||cur===4?"on":i===cur?"cur":"")+'"></i>';l+='<span>'+s[1]+'</span>';});
  return h+'</div>'+l+'</div>';
}

    h='<div class="grid2"><div class="card"><div class="num">'+up.length+'</div>Partidos próximos'+(sinAsig?' · <span class="badge warn">'+sinAsig+' sin asignar</span>':'')+'</div>'+

function csvCell(v){v=String(v==null?"":v);return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function buildCsv(){

    var c=m.cov,i=stageIdx(m.stage),t=total(c),p=c?(Number(c.paid)||0):0;
    rows.push([m.date,m.time,m.cat,m.teams,m.venue,userName(m.f1),userName(m.f2),userName(m.ed),i<0?"Sin iniciar":STAGES[i][1],

async function saveCsv(name,text){
  try{
    if(window.claude&&window.claude.use){
      var d=await window.claude.use("downloads");
      if(d){await d.save({filename:name,data:text});return;}
    }
  }catch(e){if(e&&e.code==="declined")return;}
  var b=new Blob([text],{type:"text/csv;charset=utf-8"});
  var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();
}

function icsEsc(t){return String(t==null?"":t).replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\r?\n/g,"\\n");}
function evStart(m){return m.date.replace(/-/g,"")+"T"+m.time.replace(":","")+"00";}
function evEnd(m){
  var p=m.time.split(":"),mins=(+p[0])*60+(+p[1])+60,d=m.date;
  if(mins>=1440){mins-=1440;d=addDays(d,1);}
  return d.replace(/-/g,"")+"T"+pad(Math.floor(mins/60))+pad(mins%60)+"00";
}
function evTitle(m){return "Partido: "+m.teams+" ("+m.cat+")";}
function evLoc(m){return m.venue+(m.addr&&m.addr!==m.venue?", "+m.addr:"");}
function evDesc(m){var t="Cobertura Tanabi Sport. Categoría "+m.cat+".";if(linkOk(m.link))t+=" Carpeta de fotos: "+m.link;return t;}
function gcalLink(m){
  return "https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent(evTitle(m))+"&dates="+evStart(m)+"/"+evEnd(m)+"&details="+encodeURIComponent(evDesc(m))+"&location="+encodeURIComponent(evLoc(m));
}
function icsFold(line){var out=[],i=0;while(line.length-i>60){out.push(line.substr(i,60));i+=60;}out.push(line.substr(i));return out.join("\r\n ");}
function buildIcs(list){
  var L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Tanabi Sport//Partidos//ES","CALSCALE:GREGORIAN","METHOD:PUBLISH"];
  var stamp=todayStr().replace(/-/g,"")+"T000000Z";
  list.forEach(function(m){
    L.push("BEGIN:VEVENT","UID:partido-"+m.id+"@tanabisport","DTSTAMP:"+stamp,"DTSTART:"+evStart(m),"DTEND:"+evEnd(m),
      "SUMMARY:"+icsEsc(evTitle(m)),"LOCATION:"+icsEsc(evLoc(m)),"DESCRIPTION:"+icsEsc(evDesc(m)),
      "BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:Partido en 1 hora","TRIGGER:-PT1H","END:VALARM","END:VEVENT");
  });
  L.push("END:VCALENDAR");
  return L.map(icsFold).join("\r\n")+"\r\n";
}
async function saveFile(name,text,mime){
  try{
    if(window.claude&&window.claude.use){
      var dl=await window.claude.use("downloads");
      if(dl){await dl.save({filename:name,data:text});return;}
    }
  }catch(e){if(e&&e.code==="declined")return;}
  var b=new Blob([text],{type:mime});
  var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();
}

function render(){
  var app=document.getElementById("app");
  if(S.booting){app.innerHTML='<p class="muted" style="padding:60px 0;text-align:center">Cargando…</p>';return;}
  var v=S.view;
  if(v!=="home"&&v!=="shop"&&v!=="recover"&&!me())v="login";
  if(v==="login"&&me())v="dash";
  if(me()&&me().role==="pending"&&v!=="home"&&v!=="shop"&&v!=="recover")v="pending";
  app.innerHTML=bannerHtml()+(v==="home"?viewHome():v==="shop"?viewShop():v==="recover"?viewRecover():v==="pending"?viewPending():v==="login"?viewLogin():viewDash());
}

/* ---------- Eventos ---------- */
document.addEventListener("click",function(e){
  var t=e.target.closest("[data-act],[data-tab],[data-day],[data-del],[data-save],[data-deluser]");
  if(!t)return;
  var d=t.dataset;
  if(d.tab){S.tab=d.tab;S.bulkMsg="";S.bulkText="";render();return;}
  if(d.day){S.sel=d.day;render();return;}
  if(d.del&&isAdmin()){S.matches=S.matches.filter(function(m){return String(m.id)!==d.del;});save();render();return;}
  if(d.deluser&&isAdmin()){
    S.users=S.users.filter(function(u){return u.id!==d.deluser;});
    S.matches.forEach(function(m){["f1","f2","ed"].forEach(function(k){if(m[k]===d.deluser)m[k]="";});});
    save();render();return;
  }
  if(d.save){
    var m=S.matches.filter(function(x){return String(x.id)===d.save;})[0],card=t.closest("[data-card]");
    if(!m||!card||!(isAdmin()||isMine(m)))return;
    if(!isAdmin()&&m.cov&&m.cov.locked){alert("Esta cobertura está bloqueada. Pide autorización al administrador.");return;}
    var q=function(k){var el=card.querySelector('[data-f="'+k+'"]');return el;};
    var old=m.cov||{players:0,all:false,nums:"",price:200,paid:0};
    var all=q("all").checked;
    var c={players:Math.max(0,parseInt(q("players").value,10)||0),all:all,nums:all?"":q("nums").value.trim(),price:old.price,paid:old.paid};
    c.method=old.method||"";var e1=q("p1"),e2=q("p2");
    if(e1)c.p1=Math.max(0,parseInt(e1.value,10)||0);else if(old.p1!=null)c.p1=old.p1;
    if(e2)c.p2=Math.max(0,parseInt(e2.value,10)||0);else if(old.p2!=null)c.p2=old.p2;
    if(isAdmin()){c.price=Math.max(0,Number(q("price").value)||0);c.paid=Math.max(0,Number(q("paid").value)||0);var qm=q("method");if(qm)c.method=qm.value;}
    c.locked=isAdmin()?!!old.locked:true;m.cov=c;m.covReq=null;save();render();return;
  }
  var a=d.act;
  if(a==="goLogin"){S.view=me()?"dash":"login";S.loginErr="";render();}
  else if(a==="goHome"){S.view="home";render();}
  else if(a==="goDash"){S.view="dash";render();}
  else if(a==="logout"){doLogout();}
  else if(a==="doLogin"){
    var un=document.getElementById("u").value.trim().toLowerCase(),pw=document.getElementById("p").value;
    var f=S.users.filter(function(u){return u.user.toLowerCase()===un&&u.pass===pw;})[0];
    if(f){S.meId=f.id;S.view="dash";S.tab="resumen";S.loginErr="";}else S.loginErr="Usuario o contraseña incorrectos.";
    render();
  }
  else if(a==="prevM"){S.month--;if(S.month<0){S.month=11;S.year--;}render();}
  else if(a==="nextM"){S.month++;if(S.month>11){S.month=0;S.year++;}render();}
  else if(a==="addMatch"&&isAdmin()){
    var dt=document.getElementById("fd").value,fm1=document.getElementById("fm1"),home="",away="",teams="",catSel="";
    if(fm1){
      home=fm1.value;away=document.getElementById("fm2").value;catSel=document.getElementById("fc").value;
      if(!dt||!catSel||!home||!away){alert("Elige la fecha, la categoría y los dos equipos.");return;}
      if(home===away){alert("El equipo local y el visitante no pueden ser el mismo.");return;}
      teams=home+" vs "+away;
    }else{
      teams=document.getElementById("fm").value.trim();catSel=document.getElementById("fc").value.trim()||"General";
      if(!dt||!teams){alert("Escribe la fecha y los equipos.");return;}
    }
    var v=document.getElementById("fv").value.trim()||"Por definir";
    S.matches.push({id:nid(),date:dt,time:document.getElementById("ft").value||"10:00",cat:catSel,teams:teams,home:home,away:away,venue:v,addr:document.getElementById("fa").value.trim()||v,f1:"",f2:"",ed:"",stage:"",cov:null,link:""});
    notify(idsRole("foto"),"Nuevo partido: "+teams+" · "+fmtDate(dt));S.sel=dt;save();render();
  }
  else if(a==="addUser"&&isAdmin()){
    var nn=document.getElementById("nn").value.trim(),nu=document.getElementById("nu").value.trim(),np=document.getElementById("np").value;
    if(!nn||!nu||!np){alert("Completa nombre, usuario y contraseña.");return;}
    if(S.users.some(function(u){return u.user.toLowerCase()===nu.toLowerCase();})){alert("Ese usuario ya existe.");return;}
    S.users.push({id:"u"+(S.nextUid++),name:nn,user:nu,pass:np,role:document.getElementById("nr").value});
    save();render();
  }
  else if(a==="approve"&&isAdmin()||a==="recalc"&&isAdmin()){
    var kk=d.key.split("|"),uu=S.users.filter(function(x){return x.id===kk[0];})[0];
    if(uu){snap(uu,kk[1],"aprobado");notify([uu.id],"Pago enviado: "+weekLabel(kk[1])+". Revísalo en Mi pago.");save();render();}
  }
  else if(a==="approveAll"&&isAdmin()){
    payeesForWeek(S.payWeek).forEach(function(uu){if(!S.pays[payKey(uu.id,S.payWeek)]&&hasPay(calcPay(uu,S.payWeek))){snap(uu,S.payWeek,"aprobado");notify([uu.id],"Pago enviado: "+weekLabel(S.payWeek)+". Revísalo en Mi pago.");}});
    save();render();
  }
  else if(a==="markPaid"&&isAdmin()){
    var rr=S.pays[d.key],sel=t.closest(".match").querySelector("[data-method]");
    if(rr){rr.status="pagado";rr.method=sel?sel.value:"Transferencia";rr.paidAt=todayStr();notify([d.key.split("|")[0]],"Tu pago fue realizado por "+rr.method+" ("+weekLabel(d.key.split("|")[1])+")");save();render();}
  }
  else if(a==="accept"){
    var ka=d.key.split("|");
    if(me()&&ka[0]===me().id&&S.pays[d.key]&&S.pays[d.key].status==="aprobado"){var sp=t.closest(".match").querySelector("[data-pref]");S.pays[d.key].pref=sp?sp.value:"";S.pays[d.key].status="aceptado";notify(idsAdmin(),"Pago aprobado por "+me().name+" ("+weekLabel(ka[1])+")");save();render();}
  }
  else if(a==="askReview"){
    var kb=d.key.split("|"),inp=t.closest(".match").querySelector("[data-comment]"),cm=inp?inp.value.trim():"";
    if(!me()||kb[0]!==me().id||!S.pays[d.key])return;
    if(!cm){alert("Escribe qué hay que revisar.");return;}
    S.pays[d.key].status="revision";S.pays[d.key].comment=cm;notify(idsAdmin(),me().name+" pidió revisar su pago ("+weekLabel(kb[1])+")");save();render();
  }
  else if(a==="prevW"&&isAdmin()){S.payTouched=true;S.payWeek=addDays(S.payWeek,-7);render();}
  else if(a==="nextW"&&isAdmin()){S.payTouched=true;S.payWeek=addDays(S.payWeek,7);render();}
  else if(a==="csvPay"&&isAdmin()){saveCsv("tanabi-pagos-"+S.payWeek+".csv",buildPayCsv());}
  else if(a==="addBulk"&&isAdmin()){
    var bd=document.getElementById("bd").value,bl=document.getElementById("bt").value.split(/\r?\n/),ok=0,badL=[],badR=[];
    if(!bd){alert("Elige la fecha.");return;}
    bl.forEach(function(ln){
      if(!ln.trim())return;
      var p=ln.split("|").map(function(z){return z.trim();});
      var hm=/^(\d{1,2}):(\d{2})$/.exec(p[0]||"");
      if(!hm||!p[2]){badL.push(ln);badR.push(ln+" (falta la hora HH:MM o los equipos)");return;}
      var cc=p[1]||"General",tt=p[2],hh="",aa="";
      if(hasCatalog()){
        var cf=catFind("cats",p[1]);
        if(!cf){badL.push(ln);badR.push(ln+" (categoría no encontrada: "+(p[1]||"vacía")+")");return;}
        var tp=p[2].split(/\s+vs\.?\s+/i);
        if(tp.length!==2){badL.push(ln);badR.push(ln+" (escribe los equipos como Equipo vs Equipo)");return;}
        var th=catFind("teams",tp[0]),ta=catFind("teams",tp[1]);
        if(!th||!ta){badL.push(ln);badR.push(ln+" (equipo no encontrado: "+(!th?tp[0]:tp[1])+")");return;}
        if(th===ta){badL.push(ln);badR.push(ln+" (los dos equipos son el mismo)");return;}
        cc=cf;hh=th;aa=ta;tt=th+" vs "+ta;
      }
      var vv=p[3]||"Por definir";
      S.matches.push({id:nid(),date:bd,time:pad(+hm[1])+":"+hm[2],cat:cc,teams:tt,home:hh,away:aa,venue:vv,addr:p[4]||vv,f1:"",f2:"",ed:"",stage:"",cov:null,link:""});
      ok++;
    });
    if(ok)notify(idsRole("foto"),ok+" partido(s) nuevo(s) para el "+fmtDate(bd));S.sel=bd;S.bulkText=badL.join("\n");
    S.bulkMsg=ok+" partido(s) agregado(s)"+(badL.length?". "+badL.length+" línea(s) no se subieron y quedaron en el cuadro:\n"+badR.slice(0,8).join("\n")+(badR.length>8?"\n…":""):".");
    save();render();
  }
  else if(a==="take"&&me()&&me().role==="foto"){
    var mt=S.matches.filter(function(x){return String(x.id)===d.id;})[0],uf=me();
    if(mt&&!isMine(mt)&&(!mt.f1||!mt.f2)){
      var clash=S.matches.some(function(o){return o.id!==mt.id&&o.date===mt.date&&o.time===mt.time&&(o.f1===uf.id||o.f2===uf.id);});
      if(clash){alert("Ya tienes otro partido a esa hora.");return;}
      if(!mt.f1)mt.f1=uf.id;else mt.f2=uf.id;
      save();render();
    }
  }
  else if(a==="leave"&&me()&&me().role==="foto"){
    var ml=S.matches.filter(function(x){return String(x.id)===d.id;})[0];
    if(ml&&isMine(ml)&&!ml.cov){if(ml.f1===me().id)ml.f1="";if(ml.f2===me().id)ml.f2="";save();render();}
  }
  else if(a==="saveLink"&&me()&&(me().role==="admin"||me().role==="editora")){
    var mk=S.matches.filter(function(x){return String(x.id)===d.id;})[0],li=t.closest(".match").querySelector("[data-linkin]");
    if(!mk||!li)return;
    var lv=li.value.trim();
    if(lv&&!linkOk(lv)){alert("El enlace debe empezar con http:// o https://");return;}
    mk.link=lv;if(lv)notify(matchTeamIds(mk).concat(idsAdmin()),"Enlace listo: "+mk.teams);save();render();
  }
  else if(a==="copyLink"){
    var mc=S.matches.filter(function(x){return String(x.id)===d.id;})[0];
    if(mc&&linkOk(mc.link)){
      try{navigator.clipboard.writeText(mc.link).then(function(){t.textContent="Copiado";},function(){prompt("Copia el enlace:",mc.link);});}
      catch(er){prompt("Copia el enlace:",mc.link);}
    }
  }
  else if(a==="icsAll"&&me()&&me().role==="foto"){
    var upc=S.matches.filter(function(m){return isMine(m)&&m.date>=todayStr();}).sort(cmp);
    if(!upc.length){alert("No tienes partidos próximos.");return;}
    saveFile("mis-partidos-tanabi.ics",buildIcs(upc),"text/calendar;charset=utf-8");
  }
  else if(a==="icsOne"&&me()&&me().role==="foto"){
    var mo=S.matches.filter(function(x){return String(x.id)===d.id;})[0];
    if(mo&&isMine(mo))saveFile("partido-"+mo.date+".ics",buildIcs([mo]),"text/calendar;charset=utf-8");
  }
  else if(a==="csv"&&isAdmin()){saveCsv("tanabi-partidos.csv",buildCsv());}
  else if(a==="saveLive"&&isAdmin()){S.liveUrl=document.getElementById("lu").value.trim();save();render();}
  else if(a==="clearLive"&&isAdmin()){S.liveUrl="";save();render();}
});

/* ===== Módulo: extras de pago, notificaciones, finanzas, tienda y más ===== */
function byId(arr,id){return arr.filter(function(x){return String(x.id)===String(id);})[0];}
function matchById(id){return byId(S.matches,id);}
function itemById(id){return byId(S.shop.items,id);}
function idsRole(r){return byRole(r).map(function(u){return u.id;});}
function idsAdmin(){return idsRole("admin");}
function matchTeamIds(m){return [m.f1,m.f2].filter(Boolean);}
function edOk(m){return !!m.ed||!!m.edBy||byRole("editora").length===1;}
function notify(ids,text){
  ids=ids.filter(function(v,i,a){return v&&a.indexOf(v)===i;});
  if(!ids.length)return;
  S.notifs.unshift({id:nid(),date:todayStr(),to:ids,text:text,read:[]});
  if(!LIVE&&S.notifs.length>200)S.notifs.length=200;
}
function unread(){var u=me();return u?S.notifs.filter(function(n){return n.to.indexOf(u.id)>=0&&n.read.indexOf(u.id)<0;}).length:0;}
function stageNotify(m,prev){
  if(!m.stage||m.stage===prev)return;
  var t={descarga:"Fotos descargadas",seleccion:"Fotos seleccionadas",edicion:"Fotos editadas",carga:"Fotos cargadas",listos:"Archivos listos"}[m.stage];
  notify(matchTeamIds(m).concat(idsAdmin()),t+": "+m.teams);
}
function shopBtn(){
  if(S.view==="shop")return '<button class="btn small" data-x="goHomeX">Inicio</button> ';
  return S.cfg.shop?'<button class="btn small" data-x="goShop">Tienda</button> ':'';
}
function clientMsg(m){return S.cfg.tpl.split("[LINK DE GOOGLE DRIVE]").join(m.link);}
function waLink(m){return "https://wa.me/?text="+encodeURIComponent(clientMsg(m));}
function digits(s){return String(s||"").replace(/\D/g,"");}

/* ---------- Pagos: extras (bonos, reembolsos, descuentos) ---------- */
function loanPaid(L,excludeKey){
  var t=0;
  Object.keys(S.pays).forEach(function(k){
    if(k===excludeKey)return;
    (S.pays[k].ded||[]).forEach(function(x){if(x.loan===L.id)t+=x.amount;});
  });
  return t;
}
function addExtras(u,week,out){
  out.bonus=[];out.reimb=[];out.ded=[];
  S.bonuses.forEach(function(b){if(b.uid===u.id&&b.week===week)out.bonus.push({id:b.id,concept:b.concept,amount:Number(b.amount)||0});});
  S.expenses.forEach(function(x){
    if(x.uid!==u.id||x.week!==week)return;
    var tag=x.cat+(x.note?" ("+x.note+")":"");
    if(x.status==="aprobado"&&x.own)out.reimb.push({concept:"Reembolso: "+tag,amount:Number(x.amount)||0});
    if(x.status==="deducido")out.ded.push({concept:"Gasto descontado: "+tag,amount:Number(x.amount)||0});
  });
  var g=0;
  out.lines.forEach(function(l){g+=l.amount;});
  out.bonus.forEach(function(b){g+=b.amount;});
  out.reimb.forEach(function(b){g+=b.amount;});
  out.ded.forEach(function(b){g-=b.amount;});
  var key=payKey(u.id,week);
  S.loans.forEach(function(L){
    if(L.uid!==u.id||L.status!=="aprobado"||!(Number(L.weekly)>0)||week<L.since)return;
    var bal=L.amount-loanPaid(L,key);
    var cut=Math.min(Number(L.weekly),bal,Math.max(0,g));
    if(cut>0){out.ded.push({concept:"Abono a préstamo",loan:L.id,amount:cut});g-=cut;}
  });
  out.net=g;
}

function breakdownHtml(src){
  var sub=0,h=(src.lines||[]).map(lineHtml).join("");

/* ---------- Finanzas del administrador ---------- */
function monthWeeks(ym){
  var out=[],w=mondayOf(ym+"-01"),i=0;
  while(i<8){if(addDays(w,6).slice(0,7)===ym)out.push(w);w=addDays(w,7);i++;}
  return out;
}
function grossOf(x){var g=0;(x.lines||[]).forEach(function(l){g+=l.amount;});(x.bonus||[]).forEach(function(b){g+=b.amount;});return g;}
function finMonth(ym){
  var r={cobrado:0,porCobrar:0,tienda:0,sueldos:0,estim:0,gastos:0};
  S.matches.forEach(function(m){
    if(m.cov&&m.date.slice(0,7)===ym){var tt=total(m.cov),p=Number(m.cov.paid)||0;r.cobrado+=p;r.porCobrar+=Math.max(0,tt-p);}
  });
  S.orders.forEach(function(o){if((o.status==="pagado"||o.status==="entregado")&&o.date.slice(0,7)===ym)r.tienda+=o.total;});
  monthWeeks(ym).forEach(function(w){
    payeesForWeek(w).forEach(function(u){
      var rec=S.pays[payKey(u.id,w)];
      if(rec)r.sueldos+=grossOf(rec);else r.estim+=grossOf(calcPay(u,w));
    });
  });
  S.expenses.forEach(function(x){if(x.status==="aprobado"&&x.date.slice(0,7)===ym)r.gastos+=Number(x.amount)||0;});
  r.ganancia=r.cobrado+r.tienda-r.sueldos-r.gastos;
  return r;
}
function pendBox(){
  var it=[];
  var ex=S.expenses.filter(function(x){return x.status==="pendiente";}).length;
  var ln=S.loans.filter(function(x){return x.status==="solicitado";}).length;
  var rq=S.matches.filter(function(m){return m.covReq;}).length;
  var od=S.orders.filter(function(o){return o.status==="nuevo";}).length;
  if(ex)it.push(["gastos",ex+" gasto(s) por aprobar"]);
  if(ln)it.push(["prestamos",ln+" préstamo(s) solicitado(s)"]);
  if(rq)it.push(["cobertura",rq+" solicitud(es) de modificar cobertura"]);
  if(od)it.push(["tienda",od+" pedido(s) nuevo(s) en la tienda"]);
  pendingPayWeeks().forEach(function(p){it.push(["pagos",p.n+" pago(s) por aprobar: "+weekLabel(p.w),p.w]);});
  if(!it.length)return "";
  return '<div class="card" style="margin-bottom:14px"><h3>Por atender</h3>'+it.map(function(i){return '<div class="pl"><span>'+i[1]+'</span>'+(i[2]?'<button class="btn small" data-x="goPay" data-w="'+i[2]+'">Abrir</button>':'<button class="btn small" data-tab="'+i[0]+'">Abrir</button>')+'</div>';}).join("")+'</div>';
}
function finSummary(){
  if(!S.sumMonth)S.sumMonth=todayStr().slice(0,7);
  var ym=S.sumMonth,r=finMonth(ym),p=ym.split("-"),recov=0;
  S.loans.forEach(function(L){if(L.status==="aprobado")recov+=Math.max(0,L.amount-loanPaid(L,""));});
  return pendBox()+
  '<div class="card" style="margin-bottom:14px"><div class="cal-head"><button class="btn small" data-x="sumPrev" aria-label="Mes anterior">‹</button><h3 style="margin:0;text-transform:capitalize">'+MONTHS[+p[1]-1]+' '+p[0]+'</h3><button class="btn small" data-x="sumNext" aria-label="Mes siguiente">›</button></div>'+

/* ---------- Tienda ---------- */
function procImg(file,cb){
  var r=new FileReader();
  r.onload=function(){
    var im=new Image();
    im.onload=function(){
      var max=800,sc=Math.min(1,max/Math.max(im.width,im.height)),w=Math.round(im.width*sc),h=Math.round(im.height*sc);
      var c=document.createElement("canvas");c.width=w;c.height=h;
      var x=c.getContext("2d");x.drawImage(im,0,0,w,h);
      x.save();x.globalAlpha=0.35;x.fillStyle="#ffffff";x.font="bold "+Math.round(w/9)+"px sans-serif";x.textAlign="center";x.translate(w/2,h/2);x.rotate(-Math.PI/6);x.fillText("TANABI SPORT",0,0);x.restore();
      cb(c.toDataURL("image/jpeg",0.7));
    };
    im.onerror=function(){cb("");};
    im.src=r.result;
  };

/* ---------- Conexión ---------- */
function setAuth(j){
  AUTH.access=j.access_token;AUTH.refresh=j.refresh_token||AUTH.refresh;
  AUTH.exp=j.expires_at||(Math.floor(Date.now()/1000)+(j.expires_in||3600));
  AUTH.uid=(j.user&&j.user.id)||AUTH.uid;
  try{localStorage.setItem("tanabiAuth",JSON.stringify(AUTH));}catch(e){}
}
function clearAuth(){
  AUTH={access:"",refresh:"",exp:0,uid:""};
  try{localStorage.removeItem("tanabiAuth");}catch(e){}
}
async function ensureToken(){
  if(AUTH.access&&AUTH.refresh&&Date.now()/1000>AUTH.exp-60){
    try{var j=await sb("POST","/auth/v1/token?grant_type=refresh_token",{refresh_token:AUTH.refresh},{auth:false});setAuth(j);}
    catch(e){clearAuth();throw e;}
  }
}
async function sb(method,path,body,opt){
  opt=opt||{};
  if(opt.auth!==false)await ensureToken();
  var h={apikey:SBK};
  if(body!==undefined)h["Content-Type"]="application/json";
  if(AUTH.access&&opt.auth!==false)h.Authorization="Bearer "+AUTH.access;
  if(opt.prefer)h.Prefer=opt.prefer;
  var r=await fetch(SBU+path,{method:method,headers:h,body:body!==undefined?JSON.stringify(body):undefined});
  var txt=await r.text(),j=null;
  try{j=txt?JSON.parse(txt):null;}catch(e){}
  if(!r.ok){
    var err=new Error((j&&(j.message||j.msg||j.error_description||j.error))||("Error "+r.status));
    err.status=r.status;err.body=j;throw err;
  }
  return j;
}

/* ---------- Sincronización ---------- */
function buildRows(){
  var R={};
  COLS.forEach(function(c){
    R[c[1]]={};
    S[c[0]].forEach(function(o){R[c[1]][String(o.id)]={id:String(o.id),data:o,owner:(HAS_OWNER[c[1]]?String(o.uid):null)};});
  });
  R.shop_items={};S.shop.items.forEach(function(o){R.shop_items[String(o.id)]={id:String(o.id),data:o};});
  R.pays={};Object.keys(S.pays).forEach(function(k){R.pays[k]={id:k,data:S.pays[k],owner:k.split("|")[0]};});
  R.settings={cfg:{id:"cfg",data:S.cfg},rates:{id:"rates",data:S.rates},live:{id:"live",data:{url:S.liveUrl||""}},catalog:{id:"catalog",data:S.catalog}};
  return R;
}
function snapOf(R){
  var o={};
  Object.keys(R).forEach(function(t){o[t]={};Object.keys(R[t]).forEach(function(id){o[t][id]=JSON.stringify(R[t][id].data);});});
  return o;
}
function syncSoon(){
  if(!LIVE)return;
  SYNC.dirty=true;
  clearTimeout(SYNC.timer);
  SYNC.timer=setTimeout(syncNow,400);
}
async function syncNow(){
  if(!AUTH.access)return;
  if(SYNC.busy){SYNC.again=true;return;}
  SYNC.busy=true;SYNC.dirty=false;
  try{
    var R=buildRows(),tables=Object.keys(R);
    for(var ti=0;ti<tables.length;ti++){
      var table=tables[ti],rows=R[table],prev=SYNC.snap[table]||(SYNC.snap[table]={}),ids=Object.keys(rows),ins=[];
      for(var i=0;i<ids.length;i++){
        var id=ids[i],row=rows[id],j=JSON.stringify(row.data);
        if(prev[id]===j)continue;
        if(table==="settings"){
          await sb("POST","/rest/v1/settings?on_conflict=id",{id:id,data:row.data},{prefer:"resolution=merge-duplicates,return=minimal"});
          prev[id]=j;
        }else if(prev[id]!==undefined){
          var okp=await patchRow(table,id,row,prev[id]);
          if(!okp)throw new Error("No tienes permiso para guardar ese cambio ("+table+").");
          prev[id]=j;
        }else{
          var nb={id:id,data:row.data};
          if(HAS_OWNER[table])nb.owner=row.owner;
          ins.push(nb);
        }
      }
      if(ins.length){
        await sb("POST","/rest/v1/"+table,ins,{prefer:"return=minimal"});
        ins.forEach(function(x){prev[x.id]=JSON.stringify(x.data);});
      }
      if(table!=="settings"){
        var gone=Object.keys(prev).filter(function(k){return !(k in rows);});
        if(gone.length){
          var inlist="in.("+gone.map(function(x){return '"'+x.replace(/"/g,'\\"')+'"';}).join(",")+")";

function imgToBlob(file,max,q){
  return new Promise(function(res,rej){
    var r=new FileReader();
    r.onload=function(){
      var im=new Image();
      im.onload=function(){
        var sc=Math.min(1,max/Math.max(im.width,im.height)),w=Math.round(im.width*sc),h=Math.round(im.height*sc);
        var c=document.createElement("canvas");c.width=w;c.height=h;
        c.getContext("2d").drawImage(im,0,0,w,h);
        c.toBlob(function(b){if(b)res(b);else rej(new Error("No se pudo procesar la imagen"));},"image/jpeg",q);
      };
      im.onerror=function(){rej(new Error("Imagen no válida"));};
      im.src=r.result;
    };
    r.onerror=function(){rej(new Error("No se pudo leer el archivo"));};
    r.readAsDataURL(file);
  });
}

function pendingPayWeeks(){

  for(var i=0;i<9;i++){

    payeesForWeek(w).forEach(function(u){
      if(!S.pays[payKey(u.id,w)]&&hasPay(calcPay(u,w)))n++;
    });
    if(n)out.push({w:w,n:n});
  }
  return out;
}

    try{
      var r=await sb("POST","/rest/v1/rpc/app_status",{});
      var rows=[["Candado de partidos actualizado",r.candado_partidos_nuevo],["Arreglo de la cobertura",r.arreglo_cobertura],["Guardado por campos",r.guardado_por_campos],["Editora automática",r.editora_automatica],["Fotos del portafolio (tabla)",r.fotos_portafolio]];
      S.sysMsg=rows.map(function(x){return '<div class="pl"><span>'+x[0]+'</span><strong>'+(x[1]?"✓":"✗ falta")+'</strong></div>';}).join("")+'<div class="hint">Cuentas de editora: '+r.editoras+' · Partidos: '+r.partidos+'</div>';
      if(r.editoras>1)S.sysMsg+='<div class="hint">Hay más de una cuenta de editora: la asignación automática no aplica y se atribuye a quien cambia el proceso.</div>';
    }catch(e){
      S.sysMsg=(e.status===404||(e.body&&e.body.code==="PGRST202"))?'<div class="err">Falta ejecutar el script SQL más reciente (no existe la revisión).</div>':'<div class="err">No se pudo revisar: '+esc(e.message)+'</div>';
    }
    render();
  }
});

function payKind(u,inWeek){
  if(u.role==="editora")return "ed";
  if(u.role==="foto")return "foto";
  return inWeek.some(function(m){return m.f1===u.id||m.f2===u.id;})?"foto":"ed";
}
function payeesForWeek(w){
  var seen={},list=[];
  S.users.forEach(function(u){if(u.role==="foto"||u.role==="editora"){seen[u.id]=1;list.push(u);}});
  S.matches.forEach(function(m){
    if(!m.cov||mondayOf(m.date)!==w)return;
    [m.f1,m.f2,m.ed,m.edBy].forEach(function(id){
      if(!id||seen[id])return;
      var u=byId(S.users,id);
      if(u){seen[id]=1;list.push(u);}
    });
  });
  return list;
}
function whoTag(id,need){
  var u=byId(S.users,id);
  if(!u)return "cuenta eliminada";
  var bad=(need==="foto"&&u.role!=="foto")||(need==="editora"&&u.role!=="editora");
  return u.name+" ("+(u.user||"")+")"+(bad?" ⚠ rol actual: "+ROLES[u.role]:"");
}

function cardWhy(u,w){
  var ms=S.matches.filter(function(m){return m.cov&&mondayOf(m.date)===w;});
  if(!ms.length)return "No hay partidos con cobertura registrada en esta semana.";
  var mine=ms.filter(function(m){return m.f1===u.id||m.f2===u.id||m.ed===u.id||m.edBy===u.id;});
  if(!mine.length){
    var other=ms.slice(0,3).map(function(m){
      var who=[m.f1,m.f2,m.ed,m.edBy].filter(Boolean).map(function(id){var x=byId(S.users,id);return x?x.name+" ("+x.user+")":"cuenta desconocida";});
      return m.teams+" → "+(who.join(", ")||"nadie asignado");
    });
    return "Hay "+ms.length+" partido(s) con cobertura, pero ninguno está asignado a esta cuenta ("+(u.user||"")+"). Asignados a: "+other.join(" · ")+".";
  }
  return "Hay "+mine.length+" partido(s) de esta cuenta con cobertura, pero no generan pago. Revisa los jugadores y el proceso. [cuenta "+String(u.id).slice(0,8)+"]";
}

S.payWeek=addDays(mondayOf(todayStr()),-7);
if(LIVE){boot();}else{load();render();}
})();
</script>
