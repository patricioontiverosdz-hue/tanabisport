<style>
:root{
  --bg:#F3F3F1; --surface:#FFFFFF; --ink:#141414; --muted:#5E5E5A; --line:#D9D9D4;
  --turf:#141414; --turf-ink:#FFFFFF; --amber:#F0B429; --amber-ink:#141414; --alert:#B3361B; --ok:#1F7A4A;

}

  }
}
:root[data-theme="dark"]{
  --bg:#121212; --surface:#1C1C1C; --ink:#F1F1EE; --muted:#A3A39E; --line:#333330;
  --turf:#F1F1EE; --turf-ink:#121212; --alert:#FF8A6B; --ok:#6FD39A;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.5}
h1,h2,h3{font-family:"Bricolage Grotesque","Instrument Sans",system-ui,sans-serif;margin:0;line-height:1.05;letter-spacing:-.02em}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding:0 18px}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 0;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center}
.logo{height:44px;width:auto;border-radius:8px;display:block}
.who{font-size:.85rem;color:var(--muted);margin-right:8px}
.btn{border:2px solid var(--ink);background:transparent;border-radius:999px;padding:8px 16px;font-weight:600;min-height:44px}
.btn.primary{background:var(--turf);border-color:var(--turf);color:var(--turf-ink)}
.btn.amber{background:var(--amber);border-color:var(--amber);color:var(--amber-ink)}
.btn.small{padding:4px 12px;min-height:36px;font-size:.9rem}
.btn.danger{border-color:var(--alert);color:var(--alert)}
.hero{padding:28px 0 12px}
.hero h1{font-size:clamp(2.6rem,11vw,6rem);font-weight:800;max-width:11ch}
.hero p{max-width:46ch;color:var(--muted);margin:16px 0 22px;font-size:1.05rem}
.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:14px 0 36px}
@media(min-width:720px){.gallery{grid-template-columns:repeat(4,1fr)}}
.tile{position:relative;aspect-ratio:3/4;border-radius:6px;overflow:hidden;background:#222;display:flex;align-items:flex-end;padding:10px;color:#fff;font-weight:600;font-size:.9rem}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile span{position:relative;background:rgba(0,0,0,.45);padding:2px 8px;border-radius:4px}
.tile.t1{background:linear-gradient(160deg,#2B2B2B,#0F0F0F)}
.tile.t2{background:linear-gradient(200deg,#F0B429,#B27C0A);color:#141414}
.tile.t3{background:linear-gradient(140deg,#4A4A47,#1A1A19)}
.tile.t4{background:linear-gradient(180deg,#5A5A56,#232322)}
.tile.tall{grid-row:span 2;aspect-ratio:auto}
.tile::before,.tile::after{content:"";position:absolute;width:18px;height:18px;border:2px solid rgba(255,255,255,.75)}
.tile::before{top:10px;left:10px;border-right:0;border-bottom:0}
.tile::after{top:10px;right:10px;border-left:0;border-bottom:0}
.live{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:36px;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--muted);margin-right:8px}
.dot.on{background:var(--alert)}
.login{max-width:380px;margin:40px auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px}
.login h2{font-size:1.8rem;margin-bottom:6px}
label{display:block;font-weight:600;font-size:.9rem;margin:12px 0 4px}
input,select{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);min-height:44px}
input[type="checkbox"]{width:22px;height:22px;min-height:0;padding:0;accent-color:var(--turf)}
input:disabled,select:disabled{opacity:.55}
.chk{display:flex;align-items:center;gap:10px;margin:12px 0 4px;font-weight:600}
.chk input{flex:none}
.hint{color:var(--muted);font-size:.85rem;margin-top:10px}
.err{color:var(--alert);font-weight:600;margin-top:8px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 14px;border-bottom:1px solid var(--line);margin-bottom:18px}
.tab{border:0;background:transparent;padding:8px 14px;border-radius:999px;font-weight:600;white-space:nowrap;color:var(--muted);min-height:40px}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.grid2{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:760px){.grid2{grid-template-columns:1fr 1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
.grid2 .card{margin-bottom:0}
.card h3{font-size:1.3rem;margin-bottom:10px}
.num{font-family:"Bricolage Grotesque",sans-serif;font-size:2.4rem;font-weight:800}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 140px}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.8rem;font-weight:600;background:var(--line);margin:2px 4px 2px 0}
.badge.warn{background:var(--amber);color:var(--amber-ink)}
.badge.bad{background:var(--alert);color:#fff}
.badge.good{background:var(--ok);color:var(--bg)}
.muted{color:var(--muted)}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-head h3{margin:0;text-transform:capitalize}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{text-align:center;font-size:.8rem;font-weight:600;color:var(--muted);padding:4px 0}
.day{aspect-ratio:1;border:1px solid var(--line);background:var(--surface);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0;font-weight:600;min-height:44px}
.day.empty{border:0;background:transparent}
.day.today{border-color:var(--turf);border-width:2px}
.day.sel{background:var(--turf);color:var(--turf-ink);border-color:var(--turf)}
.day small{font-size:.7rem;font-weight:600;color:var(--amber-ink);background:var(--amber);border-radius:999px;padding:0 6px}
.match{border-top:1px solid var(--line);padding:14px 0}
.match:first-child{border-top:0}
.match h3{font-size:1.15rem}
.match .meta{color:var(--muted);font-size:.9rem;margin:4px 0 10px}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:10px 0 4px}
.steps i{height:8px;border-radius:4px;background:var(--line);display:block}
.steps i.on{background:var(--ok)}
.steps i.cur{background:var(--amber)}
.steplbl{font-size:.8rem;color:var(--muted);display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.loc{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.loc:first-child{border-top:0}
a{color:var(--turf);font-weight:600}
.note{background:var(--surface);border-left:4px solid var(--amber);padding:10px 14px;border-radius:6px;font-size:.9rem;margin:14px 0}
.total{font-weight:700;margin-top:10px}
.pl{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px dashed var(--line)}
.pl:first-of-type{border-top:0}
details summary{padding:6px 0}
.bar{height:14px;border-radius:7px;background:var(--line);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);min-height:120px;font:inherit;color:inherit}
footer{padding:30px 0;color:var(--muted);font-size:.85rem}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

:root{
  color-scheme:light;
  --tsi-page:#f5f7fb;--tsi-panel:#fff;--tsi-border:#e5eaf3;
  --tsi-soft:#f8fafc;--tsi-side-selected:#eef2ff;--tsi-side-selected-text:#4338ca;
  --tsi-side-hover:#f1f5f9;--tsi-caption:#64748b;--tsi-heading:#312e81;
  --tsi-shadow:#17255420;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --tsi-page:#11151b;--tsi-panel:#1c222c;--tsi-border:#364050;
  --tsi-soft:#242d39;--tsi-side-selected:#303b57;--tsi-side-selected-text:#c7d2fe;
  --tsi-side-hover:#293443;--tsi-caption:#aab6c6;--tsi-heading:#c7d2fe;
  --tsi-shadow:#00000055;
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --tsi-page:#11151b;--tsi-panel:#1c222c;--tsi-border:#364050;
    --tsi-soft:#242d39;--tsi-side-selected:#303b57;--tsi-side-selected-text:#c7d2fe;
    --tsi-side-hover:#293443;--tsi-caption:#aab6c6;--tsi-heading:#c7d2fe;

  }

        S.cfg=Object.assign({loans:true,shop:true,reservasPublicas:true,autoArchive:false,whatsapp:"",tpl:DEFAULT_TPL},S.cfg);

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function pad(n){return n<10?"0"+n:""+n;}
function ymd(y,m,d){return y+"-"+pad(m+1)+"-"+pad(d);}
function todayStr(){var t=new Date();return ymd(t.getFullYear(),t.getMonth(),t.getDate());}
function fmtDate(s){var p=s.split("-");return parseInt(p[2],10)+" de "+MONTHS[parseInt(p[1],10)-1];}
function money(n){return "$"+(Number(n)||0).toLocaleString("es-MX");}
function me(){return S.users.filter(function(u){return u.id===S.meId;})[0]||null;}
function isAdmin(){var u=me();return !!u&&u.role==="admin";}
function userName(id){var u=S.users.filter(function(x){return x.id===id;})[0];return u?u.name:"";}
function byRole(r){return S.users.filter(function(u){return u.role===r;});}
function cmp(a,b){return (a.date+a.time)<(b.date+b.time)?-1:1;}
function stageIdx(s){for(var i=0;i<STAGES.length;i++)if(STAGES[i][0]===s)return i;return -1;}
function total(c){return c?Math.max(0,(Number(c.players)||0)*(Number(c.price)||0)-(Number(c.discount)||0)):0;}
// Puente financiero: venta bruta - descuento - saldo pendiente + cobros extra = efectivo cobrado.
// El descuento reduce los ingresos, NO es un segundo gasto sobre el cobro neto.
function brutoCobertura(c){return c?Math.max(0,(Number(c.players)||0)*(Number(c.price)||0)):0;}
function descuentoCobertura(c){return c?Math.max(0,brutoCobertura(c)-total(c)):0;}
function mapsLink(q){return /^https?:\/\//i.test(q)?q:"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q);}
function isMine(m){var u=me();return !!u&&(m.f1===u.id||m.f2===u.id);}

function pd(x){var p=x.split("-");return new Date(+p[0],+p[1]-1,+p[2],12);}
function dstr(d){return ymd(d.getFullYear(),d.getMonth(),d.getDate());}
function addDays(x,n){var d=pd(x);d.setDate(d.getDate()+n);return dstr(d);}
function mondayOf(x){var d=pd(x),w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return dstr(d);}
function weekLabel(w){return "Semana del "+fmtDate(w)+" al "+fmtDate(addDays(w,6));}
function rateFor(kind,n){var t=S.rates[kind];for(var i=0;i<t.length;i++){if(n>=t[i][0]&&n<=t[i][1])return t[i][2];}return 0;}
function tramoLabel(kind,n){var t=S.rates[kind];for(var i=0;i<t.length;i++){if(n>=t[i][0]&&n<=t[i][1])return t[i][1]>=9999?t[i][0]+" o más":t[i][0]+" a "+t[i][1];}return "";}
function playersFor(m,uid){
  if(!m.cov)return 0;
  var ids=[];[m.f1,m.f2].forEach(function(x){if(x&&ids.indexOf(x)<0)ids.push(x);});
  if(ids.indexOf(uid)<0)return 0;
  if(ids.length===1)return Number(m.cov.players)||0;
  return Number(uid===m.f1?m.cov.p1:m.cov.p2)||0;
}
function calcPay(u,week){
  var out={lines:[],skipped:[],notes:[],total:0,rateNote:""};
  var inWeek=S.matches.filter(function(m){return m.cov&&mondayOf(m.date)===week;}).sort(cmp);
  var kind=payKind(u,inWeek);
  if(kind==="foto"){
    inWeek.forEach(function(m){
      if(m.f1!==u.id&&m.f2!==u.id)return;
      var n=playersFor(m,u.id);
      if(m.f1&&m.f2&&m.f1!==m.f2&&!(Number(m.cov.p1)||0)&&!(Number(m.cov.p2)||0))out.notes.push("Falta repartir los jugadores entre fotógrafos en "+m.teams+".");
      if(!n)return;
      var r=rateFor("foto",n);
      out.lines.push({mid:m.id,label:m.teams,date:m.date,players:n,tramo:tramoLabel("foto",n),rate:r,amount:n*r});
    });
  }else if(kind==="ed"){
    var inc=[],tot=0;
    inWeek.forEach(function(m){
      if(m.ed!==u.id&&m.edBy!==u.id&&!(!m.ed&&!m.edBy&&byRole("editora").length===1))return;
      if(m.stage==="listos"){inc.push(m);tot+=Number(m.cov.players)||0;}
      else{var si=stageIdx(m.stage);out.skipped.push(m.teams+" ("+(si<0?"sin iniciar":STAGES[si][1])+", "+(Number(m.cov.players)||0)+" jugadores)");}
    });
    var sinEd=inWeek.filter(function(m){return !m.ed&&!m.edBy&&byRole("editora").length>1;}).length;
    if(sinEd)out.notes.push("Hay "+sinEd+" partido(s) de la semana sin editora asignada. Asígnala en Partidos o espera a que la editora cambie su proceso.");
    var r=rateFor("ed",tot);
    if(tot)out.rateNote="Total de la semana: "+tot+" jugadores editados, tramo "+tramoLabel("ed",tot)+", "+money(r)+" por jugador";
    inc.forEach(function(m){var n=Number(m.cov.players)||0;out.lines.push({mid:m.id,label:m.teams,date:m.date,players:n,tramo:tramoLabel("ed",tot),rate:r,amount:n*r});});
  }
  out.lines.forEach(function(l){out.total+=l.amount;});
  addExtras(u,week,out);
  return out;
}

function snap(u,w,status){

  S.pays[payKey(u.id,w)]={status:status||"aprobado",lines:c.lines,total:c.total,bonus:c.bonus,reimb:c.reimb,ded:c.ded,net:c.net,rateNote:c.rateNote,comment:"",method:"",paidAt:""};
}

}

function conflicts(m){
  var out=[];
  act().forEach(function(o){
    if(o.id!==m.id&&o.date===m.date&&o.time===m.time){
      ["f1","f2"].forEach(function(k){
        if(m[k]&&(o.f1===m[k]||o.f2===m[k])&&out.indexOf(userName(m[k]))<0)out.push(userName(m[k]));
      });
    }
  });
  if(m.f1&&m.f1===m.f2)out.push(userName(m.f1)+" (repetido)");
  return out;
}
function status(m){

  return '<span class="badge good">Asignado</span>';
}
function stageBadge(m){

}

var TSI_THEME_KEY='tsi-ui-theme-v1';
function tsiThemeMode(){
  try{var mode=localStorage.getItem(TSI_THEME_KEY);return mode==='dark'||mode==='light'?mode:'auto';}
  catch(e){return 'auto';}
}
function tsiThemeApply(mode){
  if(mode!=='light'&&mode!=='dark')mode='auto';
  if(mode==='auto')document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme',mode);
  try{localStorage.setItem(TSI_THEME_KEY,mode);}catch(e){}
  tsiThemeMeta();
}
function tsiThemeMeta(){
  var mode=tsiThemeMode();
  var dark=mode==='dark'||(mode==='auto'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);
  var meta=document.querySelector('meta[name="theme-color"]');
  if(meta)meta.setAttribute('content',dark?'#11151b':'#f5f7fb');
}

  var mode=tsiThemeMode();

    '<select data-tsi-theme-choice aria-label="Modo de apariencia">'+

    '<option value="light"'+(mode==='light'?' selected':'')+'>Día</option>'+
    '<option value="dark"'+(mode==='dark'?' selected':'')+'>Noche</option>'+
    '</select></label>';
}
document.addEventListener('change',function(event){
  if(event.target&&event.target.matches('[data-tsi-theme-choice]'))tsiThemeApply(event.target.value);
});
if(window.matchMedia){
  var tsiColorMedia=window.matchMedia('(prefers-color-scheme: dark)');

function csvCell(v){v=String(v==null?"":v);return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function buildCsv(){
  var head=["Fecha","Hora","Categoría","Equipos","Lugar","Fotógrafo A","Fotógrafo B","Editora","Proceso","Jugadores cubiertos","Todo el equipo","Números","WhatsApp de coordinadora","Precio por jugador","Total","Pagado","Saldo","Medio de pago del cliente","Carpeta de fotos","Recibido por fotógrafos","Estado del partido","Archivado el","Motivo del archivo"];
  var rows=[head];
  S.matches.slice().sort(cmp).forEach(function(m){
    var c=m.cov,i=stageIdx(m.stage),t=total(c),p=c?(Number(c.paid)||0):0;
    rows.push([m.date,m.time,m.cat,m.teams,m.venue,userName(m.f1),userName(m.f2),userName(m.ed),i<0?"Sin iniciar":STAGES[i][1],
      c?c.players:"",c?(c.all?"Sí":"No"):"",c?c.nums:"",c?(c.coordinatorWa||""):"",c?c.price:"",c?t:"",c?p:"",c?Math.max(0,t-p):"",c?(c.method||""):"",m.link||"",(m.cobros||[]).reduce(function(a,x){return a+(Number(x.amount)||0);},0),m.archived?"Archivado":"Activo",m.archivedAt||"",archReason(m)]);
  });
  return "\ufeff"+rows.map(function(r){return r.map(csvCell).join(",");}).join("\r\n");
}
async function saveCsv(name,text){
  try{
    if(window.claude&&window.claude.use){
      var d=await window.claude.use("downloads");
      if(d){await d.save({filename:name,data:text});return;}
    }
  }catch(e){if(e&&e.code==="declined")return;}
  var b=new Blob([text],{type:"text/csv;charset=utf-8"});
  var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();
}

function payAdminCard(u){
  var w=S.payWeek,k=payKey(u.id,w),c=calcPay(u,w),rec=S.pays[k];

  var src=rec||c;

  if(!hasPay(src)&&!c.skipped.length&&!c.notes.length)return h+'<p class="muted" style="margin:6px 0 0">Sin pago esta semana. '+esc(cardWhy(u,w))+'</p></div>';
  if(src.rateNote)h+='<div class="hint" style="margin:4px 0">'+esc(src.rateNote)+'</div>';
  h+=breakdownHtml(src);
  c.notes.forEach(function(n){h+='<div class="err" style="font-size:.9rem">'+esc(n)+'</div>';});
  if(c.skipped.length)h+='<div class="hint">Aún no cuenta: '+esc(c.skipped.join(", "))+'.</div>';

  }else{
    h+=payBadge(rec.status,true);
    var changed=sigOf(c)!==sigOf(rec);
    if(changed)h+='<span class="badge warn">Cambió desde la aprobación (ahora '+money(c.net)+')</span><div class="note"><b>Con los partidos actuales:</b>'+breakdownHtml(c)+'</div>';

function buildPayCsv(){
  var w=S.payWeek,names={aprobado:"Enviado",aceptado:"Aceptado",revision:"Revisión pedida",pagado:"Pagado"};
  var rows=[["Semana","Trabajador","Rol","Partido","Fecha","Jugadores","Tramo","Tarifa por jugador","Importe","Estado","Medio de pago"]];
  payeesForWeek(w).forEach(function(u){
    var rec=S.pays[payKey(u.id,w)],src=rec||calcPay(u,w);
    src.lines.forEach(function(l){rows.push([w,u.name,ROLES[u.role],l.label,l.date,l.players,l.tramo,l.rate,l.amount,rec?names[rec.status]:"Por aprobar",rec&&rec.method?rec.method:""]);});
    [["Bono",src.bonus,1],["Reembolso",src.reimb,1],["Descuento",src.ded,-1]].forEach(function(g){(g[1]||[]).forEach(function(b){rows.push([w,u.name,ROLES[u.role],g[0]+": "+b.concept,"","","","",g[2]*b.amount,rec?names[rec.status]:"Por aprobar",rec&&rec.method?rec.method:""]);});});

function icsEsc(t){return String(t==null?"":t).replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\r?\n/g,"\\n");}
function evStart(m){return m.date.replace(/-/g,"")+"T"+m.time.replace(":","")+"00";}
function evEnd(m){
  var p=m.time.split(":"),mins=(+p[0])*60+(+p[1])+60,d=m.date;
  if(mins>=1440){mins-=1440;d=addDays(d,1);}
  return d.replace(/-/g,"")+"T"+pad(Math.floor(mins/60))+pad(mins%60)+"00";
}
function evTitle(m){return "Partido: "+m.teams+" ("+m.cat+")";}
function evLoc(m){return m.venue+(m.addr&&m.addr!==m.venue?", "+m.addr:"");}
function evDesc(m){var t="Cobertura Tanabi Sport. Categoría "+m.cat+".";if(linkOk(m.link))t+=" Carpeta de fotos: "+m.link;return t;}
function gcalLink(m){
  return "https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent(evTitle(m))+"&dates="+evStart(m)+"/"+evEnd(m)+"&details="+encodeURIComponent(evDesc(m))+"&location="+encodeURIComponent(evLoc(m));
}
function icsFold(line){var out=[],i=0;while(line.length-i>60){out.push(line.substr(i,60));i+=60;}out.push(line.substr(i));return out.join("\r\n ");}
function buildIcs(list){
  var L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Tanabi Sport//Partidos//ES","CALSCALE:GREGORIAN","METHOD:PUBLISH"];
  var stamp=todayStr().replace(/-/g,"")+"T000000Z";
  list.forEach(function(m){

async function saveFile(name,text,mime){
  try{
    if(window.claude&&window.claude.use){
      var dl=await window.claude.use("downloads");
      if(dl){await dl.save({filename:name,data:text});return;}
    }
  }catch(e){if(e&&e.code==="declined")return;}
  var b=new Blob([text],{type:mime});
  var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();
}

function byId(arr,id){return arr.filter(function(x){return String(x.id)===String(id);})[0];}
function matchById(id){return byId(S.matches,id);}
function itemById(id){return byId(S.shop.items,id);}
function idsRole(r){return byRole(r).map(function(u){return u.id;});}
function idsAdmin(){return idsRole("admin");}
function matchTeamIds(m){return [m.f1,m.f2].filter(Boolean);}
function edOk(m){return !!m.ed||!!m.edBy||byRole("editora").length===1;}
function notify(ids,text){
  ids=ids.filter(function(v,i,a){return v&&a.indexOf(v)===i;});
  if(!ids.length)return;
  S.notifs.unshift({id:nid(),date:todayStr(),to:ids,text:text,read:[]});
  if(!LIVE&&S.notifs.length>200)S.notifs.length=200;
}
function unread(){var u=me();return u?S.notifs.filter(function(n){return n.to.indexOf(u.id)>=0&&n.read.indexOf(u.id)<0;}).length:0;}
function stageNotify(m,prev){
  if(!m.stage||m.stage===prev)return;
  var t={descarga:"Fotos descargadas",seleccion:"Fotos seleccionadas",edicion:"Fotos editadas",carga:"Fotos cargadas",listos:"Archivos listos"}[m.stage];
  notify(matchTeamIds(m).concat(idsAdmin()),t+": "+m.teams);
}
function shopBtn(){
  if(S.view==="shop"||S.view==="reserve")return '<button class="btn small" data-x="goHomeX">Inicio</button> ';

}
function clientMsg(m){return S.cfg.tpl.split("[LINK DE GOOGLE DRIVE]").join(m.link);}
function waPhone(s){var n=digits(s);return n.length===10?"52"+n:(n.length>=11&&n.length<=15?n:"");}
function waLink(m){var tel=waPhone(m.cov&&m.cov.coordinatorWa);return "https://wa.me/"+tel+"?text="+encodeURIComponent(clientMsg(m));}
function digits(s){return String(s||"").replace(/\D/g,"");}

/* ---------- Pagos: extras (bonos, reembolsos, descuentos) ---------- */
function loanPaid(L,excludeKey){
  var t=0;
  Object.keys(S.pays).forEach(function(k){
    if(k===excludeKey)return;
    (S.pays[k].ded||[]).forEach(function(x){if(x.loan===L.id)t+=x.amount;});
  });
  return t;
}
function addExtras(u,week,out){
  out.bonus=[];out.reimb=[];out.ded=[];
  S.bonuses.forEach(function(b){if(b.kind!=="deduction"&&b.uid===u.id&&b.week===week)out.bonus.push({id:b.id,concept:b.concept,amount:Number(b.amount)||0});});
  S.expenses.forEach(function(x){
    if(x.uid!==u.id||x.week!==week)return;
    var tag=x.cat+(x.note?" ("+x.note+")":"");
    if(x.status==="aprobado"&&x.own)out.reimb.push({concept:"Reembolso: "+tag,amount:Number(x.amount)||0});
    if(x.status==="deducido")out.ded.push({concept:"Gasto descontado: "+tag,amount:Number(x.amount)||0});
  });
  S.bonuses.forEach(function(b){if(b.kind==='deduction'&&b.uid===u.id&&b.week===week)out.ded.push({id:b.id,concept:b.concept,amount:Number(b.amount)||0});});
  var g=0;
  out.lines.forEach(function(l){g+=l.amount;});
  out.bonus.forEach(function(b){g+=b.amount;});
  out.reimb.forEach(function(b){g+=b.amount;});
  out.ded.forEach(function(b){g-=b.amount;});
  var key=payKey(u.id,week);
  S.loans.forEach(function(L){
    if(L.uid!==u.id||L.status!=="aprobado"||!(Number(L.weekly)>0)||week<L.since)return;
    var bal=L.amount-loanPaid(L,key);
    var cut=Math.min(Number(L.weekly),bal,Math.max(0,g));
    if(cut>0){out.ded.push({concept:"Abono a préstamo",loan:L.id,amount:cut});g-=cut;}
  });
  out.net=g;
}

function monthWeeks(ym){
  var out=[],w=mondayOf(ym+"-01"),i=0;
  while(i<8){if(addDays(w,6).slice(0,7)===ym)out.push(w);w=addDays(w,7);i++;}
  return out;
}
function grossOf(x){var g=0;(x.lines||[]).forEach(function(l){g+=l.amount;});(x.bonus||[]).forEach(function(b){g+=b.amount;});return g;}
function finMonth(ym){
  var r={cobrado:0,porCobrar:0,tienda:0,sueldos:0,estim:0,gastos:0,bruto:0,descuentos:0,excedente:0};
  S.matches.forEach(function(m){
    if(m.cov&&m.date.slice(0,7)===ym){var tt=total(m.cov),p=Number(m.cov.paid)||0;r.bruto+=brutoCobertura(m.cov);r.descuentos+=descuentoCobertura(m.cov);r.cobrado+=p;r.porCobrar+=Math.max(0,tt-p);r.excedente+=Math.max(0,p-tt);}
  });
  S.orders.forEach(function(o){if((o.status==="pagado"||o.status==="entregado")&&o.date.slice(0,7)===ym)r.tienda+=o.total;});
  monthWeeks(ym).forEach(function(w){
    payeesForWeek(w).forEach(function(u){
      var rec=S.pays[payKey(u.id,w)];
      if(rec)r.sueldos+=grossOf(rec);else r.estim+=grossOf(calcPay(u,w));
    });
  });
  S.expenses.forEach(function(x){if(x.status==="aprobado"&&x.date.slice(0,7)===ym)r.gastos+=Number(x.amount)||0;});
  r.ganancia=r.bruto-r.descuentos-r.porCobrar+r.excedente+r.tienda-r.sueldos-r.gastos;
  return r;
}
function pendBox(){
  var it=[];

  var rq=S.matches.filter(function(m){return m.covReq;}).length;
  var od=S.orders.filter(function(o){return o.status==="nuevo";}).length;
  if(ex)it.push(["gastos",ex+" gasto(s) por aprobar"]);
  if(ln)it.push(["prestamos",ln+" préstamo(s) solicitado(s)"]);
  if(rq)it.push(["cobertura",rq+" solicitud(es) de modificar cobertura"]);
  if(od)it.push(["tienda",od+" pedido(s) nuevo(s) en la tienda"]);
  var rv=S.reservations.filter(function(x){return x.status==="nueva";}).length;
  if(rv)it.push(["reservaciones",rv+" reservación(es) de clientes por atender"]);
  pendingPayWeeks().forEach(function(p){it.push(["pagos",p.n+" pago(s) por aprobar: "+weekLabel(p.w),p.w]);});

async function av29PickImages(files){
  if(!isAdmin()||AV29.busy||!AV29.draft||!files.length)return;
  av29ReadForm();var d=AV29.draft,owner=me().id;
  if(d.images.length+files.length>5){AV29.error='Puedes añadir hasta 5 imágenes por aviso.';render();return;}
  if(files.some(function(f){return !/^image\/(jpeg|png|webp|gif|heic|heif)$/.test(f.type)||f.size>20*1024*1024;})){AV29.error='Selecciona imágenes compatibles de hasta 20 MB.';render();return;}
  AV29.busy=true;AV29.error='';render();
  try{
    var added=[];
    for(var i=0;i<files.length;i++){
      var blob=await imgToBlob(files[i],1600,.78);if(blob.size>450000)blob=await imgToBlob(files[i],1200,.68);
      var src=await av29AsDataURL(blob);if(src.length>650000)throw new Error('Reduce el tamaño de '+files[i].name+'.');
      added.push({name:files[i].name.slice(0,160),src:src});
    }
    if(JSON.stringify(d.images.concat(added)).length>2500000)throw new Error('Las imágenes juntas son demasiado grandes.');
    if(isAdmin()&&me().id===owner&&AV29.draft===d)d.images=d.images.concat(added);
  }catch(e){if(me()&&me().id===owner)AV29.error=e.message;}
  finally{if(me()&&me().id===owner){AV29.busy=false;render();}}
}
function av29Format(type){
  if(!isAdmin()||AV29.busy||!AV29.draft)return;
  var el=document.getElementById('av29-text');if(!el)return;
  av29ReadForm();var start=el.selectionStart,end=el.selectionEnd,selected=el.value.slice(start,end),insert='';
  if(type==='bold'||type==='italic'){var mark=type==='bold'?'**':'*';insert=mark+(selected||'texto')+mark;}
  else if(type==='link'){var href=prompt('Dirección del enlace (https://…)','https://');if(!href)return;var url=null;try{url=new URL(href);}catch(e){}if(!url||!/^https?:$/.test(url.protocol)||url.username||url.password){alert('Usa un enlace http o https válido.');return;}insert='['+(selected||'Enlace')+']('+url.href.replace(/\)/g,'%29')+')';}
  else {start=el.value.lastIndexOf('\n',start-1)+1;var next=el.value.indexOf('\n',end);end=next<0?el.value.length:next;var prefix=type==='heading'?'## ':type==='number'?'1. ':'- ';insert=el.value.slice(start,end).split('\n').map(function(line,i){return (type==='number'?(i+1)+'. ':prefix)+line;}).join('\n');}
  el.value=el.value.slice(0,start)+insert+el.value.slice(end);AV29.draft.text=el.value;AV29.draft.format='markdown';el.focus();el.setSelectionRange(start,start+insert.length);
}

var tsiFbPhotos=[],tsiFbBusy=false,tsiFbUrls={};
function tsiFbPhotoHtml(comment){
 var photos=tsiFbPhotos.filter(function(p){return String(p.feedback_id)===String(comment.id);});
 if(!photos.length)return '';
 return '<div class="tsi-fb-photo-row">'+photos.map(function(p){

 }).join('')+'</div>';

async function tsiFbLoadPhotos(){
 if(!LIVE||!AUTH.access)return;
 try{
  var result=await sb("GET","/rest/v1/feedback_photos?select=id,match_id,feedback_id,slot,author_id,storage_path");
  tsiFbPhotos=result||[];
  var keep={};tsiFbPhotos.forEach(function(p){keep[p.id]=true;});
  Object.keys(tsiFbUrls).forEach(function(id){if(!keep[id]){URL.revokeObjectURL(tsiFbUrls[id]);delete tsiFbUrls[id];}});
  await Promise.all(tsiFbPhotos.map(async function(p){
    if(tsiFbUrls[p.id])return;
    try{
     await ensureToken();
     var res=await fetch(SBU+"/storage/v1/object/authenticated/tsi-feedback/"+p.storage_path,{headers:{apikey:SBK,Authorization:"Bearer "+AUTH.access}});
     if(!res.ok)return;
     tsiFbUrls[p.id]=URL.createObjectURL(await res.blob());
    }catch(e){}
  }));
  if(S.view==='dash'&&S.tab==='comentarios')render();
 }catch(e){console.warn("No fue posible cargar imágenes de comentarios",e);}
}
async function tsiFbDeletePhoto(p){
 await ensureToken();
 var res=await fetch(SBU+"/storage/v1/object/tsi-feedback/"+p.storage_path,{method:"DELETE",headers:{apikey:SBK,Authorization:"Bearer "+AUTH.access}});
 if(!res.ok&&res.status!==404)throw Error("El almacenamiento rechazó la eliminación.");
 await sb("DELETE","/rest/v1/feedback_photos?id=eq."+encodeURIComponent(p.id),undefined,{prefer:"return=minimal"});
 tsiFbPhotos=tsiFbPhotos.filter(function(x){return x.id!==p.id;});
 if(tsiFbUrls[p.id]){URL.revokeObjectURL(tsiFbUrls[p.id]);delete tsiFbUrls[p.id];}
}

/* ---------- Tienda ---------- */
function procImg(file,cb){
  var r=new FileReader();
  r.onload=function(){
    var im=new Image();
    im.onload=function(){
      var max=720,sc=Math.min(1,max/Math.max(im.width,im.height)),w=Math.round(im.width*sc),h=Math.round(im.height*sc);
      if(!w||!h){cb("");return;}
      var c=document.createElement("canvas");c.width=w;c.height=h;
      var x=c.getContext("2d");x.drawImage(im,0,0,w,h);
      // Blanco y negro grabado en los pixeles de la miniatura, no solo CSS.
      var p=x.getImageData(0,0,w,h),d=p.data;
      for(var i=0;i<d.length;i+=4){
        var g=Math.round(d[i]*.299+d[i+1]*.587+d[i+2]*.114);
        d[i]=g;d[i+1]=g;d[i+2]=g;
      }
      x.putImageData(p,0,0);
      // Marcas repetidas incrustadas en el archivo, incluso cuando la imagen se abre fuera del portal.
      x.save();x.translate(w/2,h/2);x.rotate(-Math.PI/6);
      x.font="900 "+Math.max(16,Math.round(w/19))+"px sans-serif";
      x.textAlign="center";x.textBaseline="middle";
      x.lineWidth=2;x.strokeStyle="rgba(0,0,0,.55)";x.fillStyle="rgba(255,255,255,.55)";
      var step=Math.max(155,Math.round(w*.53));
      for(var yy=-h*2;yy<h*2;yy+=step){
        for(var xx=-w*2;xx<w*2;xx+=step){
          x.strokeText("TANABI SPORTS",xx,yy);
          x.fillText("TANABI SPORTS",xx,yy);
        }
      }
      x.restore();
      cb(c.toDataURL("image/jpeg",.62));
    };
    im.onerror=function(){cb("");};
    im.src=r.result;
  };
  r.onerror=function(){cb("");};
  r.readAsDataURL(file);
}
function shopFolderName(it){

function shopGrouped(items){

    var name=shopFolderName(it);

  sendFb:async function(){
    var u=me();if(!u||(u.role!=="editora"&&u.role!=="admin")||tsiFbBusy)return;
    var m=matchById(document.getElementById("fbm").value),tx=document.getElementById("fbt").value.trim();
    var files=Array.from(document.getElementById("fbphotos").files||[]);
    if(!m||!m.cov){alert("Elige un partido con cobertura registrada.");return;}
    if(!tx){alert("Escribe el comentario.");return;}
    if(files.length>3){alert("Máximo 3 fotos por partido.");return;}
    if(files.some(function(f){return !f.type.startsWith("image/");})){alert("Selecciona únicamente fotografías.");return;}
    var button=document.querySelector('[data-x="sendFb"]');if(button){button.disabled=true;button.textContent="Guardando…";}
    tsiFbBusy=true;
    var entry={id:nid(),mid:m.id,by:u.id,text:tx,date:todayStr(),ack:[]};
    try{
      // Comprobación previa: el límite de 3 fotos corresponde al partido, no al comentario.
      var free=[];
      if(files.length){
        var existing=await sb("GET","/rest/v1/feedback_photos?select=slot&match_id=eq."+encodeURIComponent(String(m.id)));
        var occupied=new Set(existing.map(function(x){return x.slot;}));
        if(files.length>3-occupied.size)throw new Error("El partido ya tiene "+occupied.size+" foto(s). Solo quedan "+(3-occupied.size)+" espacios.");
        free=[1,2,3].filter(function(slot){return !occupied.has(slot);});
      }
      // Crear el comentario primero y registrar el snapshot para evitar un POST duplicado
      // desde el sincronizador general de TSI.
      await sb("POST","/rest/v1/feedback",{id:String(entry.id),data:entry},{prefer:"return=minimal"});
      S.feedback.push(entry);
      if(SYNC.snap.feedback)SYNC.snap.feedback[String(entry.id)]=JSON.stringify(entry);
      if(files.length){
        for(var i=0;i<files.length;i++){
          var blob=await imgToBlob(files[i],1400,0.8);
          if(blob.size>5242880)throw new Error("Una imagen supera los 5 MB permitidos.");
          var row=await sb("POST","/rest/v1/feedback_photos?select=id,storage_path,slot,feedback_id,match_id,author_id",{match_id:String(m.id),feedback_id:String(entry.id),slot:free[i],author_id:u.id},{prefer:"return=representation"});
          var photo=row[0];
          try{
            await ensureToken();
            var response=await fetch(SBU+"/storage/v1/object/tsi-feedback/"+photo.storage_path,{
              method:"POST",headers:{apikey:SBK,Authorization:"Bearer "+AUTH.access,"Content-Type":"image/jpeg"},body:blob
            });
            if(!response.ok)throw new Error("Error al subir imagen ("+response.status+")");
            tsiFbPhotos.push(photo);
          }catch(uploadError){
            try{await sb("DELETE","/rest/v1/feedback_photos?id=eq."+encodeURIComponent(photo.id),undefined,{prefer:"return=minimal"});}catch(ignore){}
            throw uploadError;
          }
        }
      }
      await tsiFbLoadPhotos();
      notify(matchTeamIds(m),"Comentario sobre las fotos de "+m.teams);
      save();render();
    }catch(e){
      S.banner="Comentario: "+(S.feedback.some(function(f){return f.id===entry.id;})?"guardado, pero hubo un problema con las fotos: ":"no se pudo guardar: ")+e.message;
      if(S.feedback.some(function(f){return f.id===entry.id;})){await tsiFbLoadPhotos();save();}
      render();
    }finally{tsiFbBusy=false;}
  },

/* ---------- Conexión ---------- */
function setAuth(j){
  AUTH.access=j.access_token;AUTH.refresh=j.refresh_token||AUTH.refresh;
  AUTH.exp=j.expires_at||(Math.floor(Date.now()/1000)+(j.expires_in||3600));
  AUTH.uid=(j.user&&j.user.id)||AUTH.uid;
  try{localStorage.setItem("tsi_staging_nksqpoigywfegcbvfhoa_auth",JSON.stringify(AUTH));}catch(e){}
}
function clearAuth(){
  AUTH={access:"",refresh:"",exp:0,uid:""};
  try{localStorage.removeItem("tsi_staging_nksqpoigywfegcbvfhoa_auth");}catch(e){}
}
async function ensureToken(){
  if(AUTH.access&&AUTH.refresh&&Date.now()/1000>AUTH.exp-60){
    try{var j=await sb("POST","/auth/v1/token?grant_type=refresh_token",{refresh_token:AUTH.refresh},{auth:false});setAuth(j);}
    catch(e){clearAuth();throw e;}
  }
}
async function sb(method,path,body,opt){
  opt=opt||{};
  if(opt.auth!==false)await ensureToken();
  var h={apikey:SBK};
  if(body!==undefined)h["Content-Type"]="application/json";
  if(AUTH.access&&opt.auth!==false)h.Authorization="Bearer "+AUTH.access;
  if(opt.prefer)h.Prefer=opt.prefer;
  var r=await fetch(SBU+path,{method:method,headers:h,body:body!==undefined?JSON.stringify(body):undefined});
  var txt=await r.text(),j=null;
  try{j=txt?JSON.parse(txt):null;}catch(e){}
  if(!r.ok){
    var err=new Error((j&&(j.message||j.msg||j.error_description||j.error))||("Error "+r.status));
    err.status=r.status;err.body=j;throw err;
  }
  return j;
}

/* ---------- Sincronización ---------- */
function buildRows(){
  var R={};
  COLS.forEach(function(c){
    R[c[1]]={};
    S[c[0]].forEach(function(o){R[c[1]][String(o.id)]={id:String(o.id),data:o,owner:(HAS_OWNER[c[1]]?String(o.uid):null)};});
  });
  R.shop_items={};S.shop.items.forEach(function(o){R.shop_items[String(o.id)]={id:String(o.id),data:o};});
  R.pays={};Object.keys(S.pays).forEach(function(k){R.pays[k]={id:k,data:S.pays[k],owner:k.split("|")[0]};});
  R.settings={cfg:{id:"cfg",data:S.cfg},rates:{id:"rates",data:S.rates},catalog:{id:"catalog",data:S.catalog},live:{id:"live",data:{url:S.liveUrl||""}}};
  return R;
}
function snapOf(R){
  var o={};
  Object.keys(R).forEach(function(t){o[t]={};Object.keys(R[t]).forEach(function(id){o[t][id]=JSON.stringify(R[t][id].data);});});
  return o;
}
function syncSoon(){
  if(!LIVE)return;
  SYNC.dirty=true;
  clearTimeout(SYNC.timer);
  SYNC.timer=setTimeout(syncNow,400);
}
async function syncNow(){
  if(!AUTH.access)return;
  if(SYNC.busy){SYNC.again=true;return;}
  SYNC.busy=true;SYNC.dirty=false;
  try{
    var R=buildRows(),tables=Object.keys(R);
    for(var ti=0;ti<tables.length;ti++){
      var table=tables[ti],rows=R[table],prev=SYNC.snap[table]||(SYNC.snap[table]={}),ids=Object.keys(rows),ins=[];
      for(var i=0;i<ids.length;i++){
        var id=ids[i],row=rows[id],j=JSON.stringify(row.data);
        if(prev[id]===j)continue;
        if(table==="settings"){
          await sb("POST","/rest/v1/settings?on_conflict=id",{id:id,data:row.data},{prefer:"resolution=merge-duplicates,return=minimal"});
          prev[id]=j;
        }else if(prev[id]!==undefined){
          var okp=await patchRow(table,id,row,prev[id]);
          if(!okp)throw new Error("No tienes permiso para guardar ese cambio ("+table+").");
          prev[id]=j;
        }else{
          var nb={id:id,data:row.data};
          if(HAS_OWNER[table])nb.owner=row.owner;
          ins.push(nb);
        }
      }
      if(ins.length){
        await sb("POST","/rest/v1/"+table,ins,{prefer:"return=minimal"});
        ins.forEach(function(x){prev[x.id]=JSON.stringify(x.data);});
      }
      if(table!=="settings"){
        var gone=Object.keys(prev).filter(function(k){return !(k in rows);});
        if(gone.length){
          var inlist="in.("+gone.map(function(x){return '"'+x.replace(/"/g,'\\"')+'"';}).join(",")+")";
          await sb("DELETE","/rest/v1/"+table+"?id="+encodeURIComponent(inlist),undefined,{prefer:"return=minimal"});
          gone.forEach(function(k){delete prev[k];});
        }
      }
    }
    for(var ui=0;ui<S.users.length;ui++){
      var u=S.users[ui],pj=JSON.stringify([u.name,u.role]);
      if(SYNC.prof[u.id]!==undefined&&SYNC.prof[u.id]!==pj){
        var pr=await sb("PATCH","/rest/v1/profiles?id=eq."+encodeURIComponent(u.id),{name:u.name,role:u.role},{prefer:"return=representation"});
        if(!pr||!pr.length)throw new Error("No tienes permiso para cambiar cuentas.");
        SYNC.prof[u.id]=pj;
      }
    }
    SYNC.busy=false;
    if(UX210)UX210.confirmCore(SYNC.snap.matches||{});
    if(SYNC.again){SYNC.again=false;syncSoon();}
  }catch(e){
    SYNC.busy=false;
    await syncFail(e);
  }
}
async function syncFail(e){
  if(e&&e.status===401){
    clearAuth();S.meId=null;S.view="login";S.banner="Tu sesión venció. Entra de nuevo.";render();return;
  }
  if(e&&e.name==="TypeError"){
    S.banner="Sin conexión. Reintentando guardar…";render();
    clearTimeout(SYNC.retry);SYNC.retry=setTimeout(syncNow,5000);return;
  }
  S.banner="No se pudo guardar: "+(e&&e.message?e.message:"error desconocido")+". Se restauraron los datos.";
  try{await loadAll();}catch(e2){}
  render();
}

function friendlyAuthError(e,mode){
  var m=(e&&e.message)||"";
  if(/invalid login/i.test(m))return "Correo o contraseña incorrectos.";
  if(/already registered|already been registered/i.test(m))return "Ese correo ya tiene cuenta. Entra o recupera tu contraseña.";
  if(/at least/i.test(m))return "La contraseña debe tener al menos 6 caracteres.";
  if(/valid email|invalid format|unable to validate email/i.test(m))return "Escribe un correo válido.";
  if(/rate limit/i.test(m))return "Demasiados intentos. Espera unos minutos.";
  if(e&&e.name==="TypeError")return "Sin conexión con el servidor.";
  return "No se pudo completar: "+m;
}

function imgToBlob(file,max,q){
  return new Promise(function(res,rej){
    var r=new FileReader();
    r.onload=function(){
      var im=new Image();
      im.onload=function(){
        var sc=Math.min(1,max/Math.max(im.width,im.height)),w=Math.round(im.width*sc),h=Math.round(im.height*sc);
        var c=document.createElement("canvas");c.width=w;c.height=h;
        c.getContext("2d").drawImage(im,0,0,w,h);
        c.toBlob(function(b){if(b)res(b);else rej(new Error("No se pudo procesar la imagen"));},"image/jpeg",q);
      };
      im.onerror=function(){rej(new Error("Imagen no válida"));};
      im.src=r.result;
    };
    r.onerror=function(){rej(new Error("No se pudo leer el archivo"));};
    r.readAsDataURL(file);
  });
}

async function patchRow(table,id,row,prevJson){
  if(!SYNC.noRpc&&table!=="settings"){
    var po={};
    try{po=JSON.parse(prevJson)||{};}catch(e){}

    Object.keys(po).forEach(function(k){if(!(k in no))drop.push(k);});
    try{
      var r=await sb("POST","/rest/v1/rpc/merge_row",{tbl:table,rid:id,patch:patch,drop_keys:drop});
      return r===true;
    }catch(e){
      if(e&&(e.status===404||(e.body&&e.body.code==="PGRST202")))SYNC.noRpc=true;

  var up=await sb("PATCH","/rest/v1/"+table+"?id=eq."+encodeURIComponent(id),body,{prefer:"return=representation"});

}

function payeesForWeek(w){
  var seen={},list=[];
  S.users.forEach(function(u){if(u.role==="foto"||u.role==="editora"){seen[u.id]=1;list.push(u);}});
  S.matches.forEach(function(m){
    if(!m.cov||mondayOf(m.date)!==w)return;
    [m.f1,m.f2,m.ed,m.edBy].forEach(function(id){
      if(!id||seen[id])return;

/* ---------- Catálogo ---------- */
function parseCsv(text){
  text=String(text).replace(/^\ufeff/,"");
  var rows=[],row=[],cur="",q=false;
  for(var i=0;i<text.length;i++){
    var ch=text.charAt(i);
    if(q){
      if(ch==='"'){if(text.charAt(i+1)==='"'){cur+='"';i++;}else q=false;}
      else cur+=ch;
    }else if(ch==='"')q=true;
    else if(ch===","||ch===";"){row.push(cur);cur="";}
    else if(ch==="\n"||ch==="\r"){
      if(ch==="\r"&&text.charAt(i+1)==="\n")i++;
      row.push(cur);cur="";rows.push(row);row=[];
    }else cur+=ch;
  }
  if(cur!==""||row.length){row.push(cur);rows.push(row);}
  return rows.filter(function(r){return r.some(function(x){return String(x).trim()!=="";});});
}
function importCatalog(text,mode){
  var rows=parseCsv(text);
  if(rows.length<2)return "El archivo no tiene filas para importar.";
  var head=rows[0].map(function(h){return String(h).trim().toLowerCase();});
  function col(names){for(var i=0;i<head.length;i++){if(names.indexOf(head[i])>=0)return i;}return -1;}
  var iE=col(["equipo","equipos"]),iC=col(["categoría","categoria","categorías","categorias"]),iF=col(["campo","campos"]),iM=col(["liga google maps","google maps","maps","liga"]);
  if(iE<0&&iC<0)return "No encontré las columnas \"Equipos\" ni \"Categoria\".";
  var c=S.catalog,newT=0,newF=0,newC=0,body=rows.slice(1);
  var indep=body.some(function(r){var a=iE>=0?(r[iE]||"").trim():"",b=iC>=0?(r[iC]||"").trim():"";return (a&&!b&&iC>=0)||(!a&&b);});
  if(mode==="replace"){c.teams=[];c.cats=[];}
  body.forEach(function(r){
    var name=iE>=0?(r[iE]||"").trim():"",cat=iC>=0?(r[iC]||"").trim():"",field=iF>=0?(r[iF]||"").trim():"",maps=iM>=0?(r[iM]||"").trim():"";
    if(cat&&c.cats.indexOf(cat)<0){c.cats.push(cat);newC++;}
    if(name){
      var t=c.teams.filter(function(x){return x.name===name;})[0];
      if(!t){t={name:name,cats:[],home:{}};c.teams.push(t);newT++;}
      if(!indep&&cat&&t.cats.indexOf(cat)<0)t.cats.push(cat);
      if(field){
        var f=fieldByName(field);
        if(!f){f={name:field,maps:""};c.fields.push(f);newF++;}
        if(maps&&!f.maps)f.maps=maps;
        if(cat&&!indep)t.home[cat]=field;
      }
    }
  });
  return (mode==="replace"?"Catálogo reemplazado. ":"")+"Importado: "+newT+" equipo(s) nuevo(s), "+newC+" categoría(s) nueva(s) y "+newF+" campo(s) nuevo(s)."+(indep?" Las listas son independientes: cualquier equipo puede jugar en cualquier categoría.":"");
}

/* ---------- Estadísticas ---------- */
var PALETTE=["#2563eb","#16a34a","#f59e0b","#dc2626","#7c3aed","#0891b2","#db2777","#65a30d","#ea580c","#0d9488"];
function donutHtml(slices,size){
  var tot=slices.reduce(function(a,s){return a+s.v;},0)||1,acc=0;
  var stops=slices.filter(function(s){return s.v>0;}).map(function(s){var a=acc/tot*100;acc+=s.v;var b=acc/tot*100;return s.color+" "+a.toFixed(2)+"% "+b.toFixed(2)+"%";});
  var bg=stops.length?"conic-gradient("+stops.join(",")+")":"var(--line)";
  return '<div role="img" aria-label="Gráfica de dona con el reparto de partidos" style="width:'+size+'px;height:'+size+'px;border-radius:50%;background:'+bg+';position:relative;flex:none"><div style="position:absolute;inset:24%;border-radius:50%;background:var(--surface)"></div></div>';
}
function statsData(){
  var ym=S.statsMonth,ms=S.matches.filter(function(m){return !ym||m.date.slice(0,7)===ym;});
  var cnt={},cov={},color={},names={},order=[],unassigned=0,byField={};
  function reg(id){if(cnt[id]==null){cnt[id]=0;cov[id]=0;names[id]=userName(id)||"Cuenta";color[id]=PALETTE[order.length%PALETTE.length];order.push(id);}}
  byRole("foto").forEach(function(f){reg(f.id);});
  ms.forEach(function(m){
    var ids=[m.f1,m.f2].filter(function(x,i,a){return x&&a.indexOf(x)===i;});
    var fld=m.venue||"Por definir";
    byField[fld]=byField[fld]||{per:{},unassigned:0,total:0};
    byField[fld].total++;
    if(!ids.length){unassigned++;byField[fld].unassigned++;}
    ids.forEach(function(id){reg(id);cnt[id]++;if(m.cov)cov[id]++;byField[fld].per[id]=(byField[fld].per[id]||0)+1;});
  });
  return {ms:ms,cnt:cnt,cov:cov,color:color,names:names,order:order,unassigned:unassigned,byField:byField};
}
function barRow(label,value,max,color,extra){
  return '<div style="margin:10px 0"><div style="display:flex;justify-content:space-between;gap:8px;font-size:.95rem"><span>'+esc(label)+'</span><strong>'+extra+'</strong></div><div class="bar" aria-hidden="true"><i style="width:'+(max?Math.round(value/max*100):0)+'%;background:'+color+'"></i></div></div>';
}
function tabEstadisticas(){
  var d=statsData(),T=d.ms.length,ym=S.statsMonth;
  var ranking=d.order.slice().sort(function(a,b){return d.cnt[b]-d.cnt[a];});
  var maxC=ranking.length?d.cnt[ranking[0]]:0;
  var nav='<div class="card"><div class="cal-head"><button class="btn small" data-x="statsPrev" aria-label="Mes anterior">‹</button><h3 style="margin:0;text-transform:capitalize;font-size:1.1rem">'+(ym?MONTHS[+ym.split("-")[1]-1]+" "+ym.split("-")[0]:"Todo el tiempo")+'</h3><button class="btn small" data-x="statsNext" aria-label="Mes siguiente">›</button></div><div style="text-align:center;margin-top:8px"><button class="btn small" data-x="statsAll">Ver todo el tiempo</button> <button class="btn small" data-x="statsNow">Este mes</button></div><p class="hint" style="text-align:center">'+T+' partido(s) en el periodo</p></div>';
  var h=nav;
  // 1) Dona: % de partidos asignados por fotógrafo
  var slices=ranking.map(function(id){return {v:d.cnt[id],color:d.color[id]};}).concat([{v:d.unassigned,color:"#9ca3af"}]);
  h+='<div class="card"><h3>Partidos asignados por fotógrafo</h3><p class="muted" style="margin-top:0">Porcentaje sobre el total de partidos. Un partido con dos fotógrafos cuenta para ambos.</p><div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap">'+donutHtml(slices,150)+'<div style="flex:1 1 180px">'+
  ranking.map(function(id){return '<div class="pl"><span><i style="display:inline-block;width:12px;height:12px;border-radius:3px;background:'+d.color[id]+';margin-right:8px"></i>'+esc(d.names[id])+'</span><strong>'+(T?Math.round(d.cnt[id]/T*100):0)+'% ('+d.cnt[id]+')</strong></div>';}).join("")+
  '<div class="pl"><span><i style="display:inline-block;width:12px;height:12px;border-radius:3px;background:#9ca3af;margin-right:8px"></i>Sin asignar</span><strong>'+(T?Math.round(d.unassigned/T*100):0)+'% ('+d.unassigned+')</strong></div></div></div></div>';
  // 2) Ranking de coberturas
  h+='<div class="card"><h3>Quién tiene más coberturas</h3><p class="muted" style="margin-top:0">Partidos que cada fotógrafo seleccionó y, entre paréntesis, los que ya tienen cobertura registrada.</p>'+
  (ranking.map(function(id){return barRow(d.names[id],d.cnt[id],maxC,d.color[id],d.cnt[id]+' ('+d.cov[id]+' registradas)');}).join("")||'<p class="muted">Sin datos.</p>')+'</div>';
  // 3) Fotógrafos por campo
  var fields=Object.keys(d.byField).sort(function(a,b){return d.byField[b].total-d.byField[a].total;});
  h+='<div class="card"><h3>Fotógrafos por campo</h3><p class="muted" style="margin-top:0">Qué fotógrafos asisten a cada campo. Gris: partidos sin fotógrafo.</p>'+
  (fields.map(function(f){
    var b=d.byField[f],totalSlots=b.unassigned,segs='',parts=[];
    Object.keys(b.per).forEach(function(id){totalSlots+=b.per[id];});
    Object.keys(b.per).sort(function(x,y){return b.per[y]-b.per[x];}).forEach(function(id){segs+='<i style="width:'+(totalSlots?b.per[id]/totalSlots*100:0)+'%;background:'+d.color[id]+'"></i>';parts.push(d.names[id]+" "+b.per[id]);});
    if(b.unassigned){segs+='<i style="width:'+(b.unassigned/totalSlots*100)+'%;background:#9ca3af"></i>';parts.push("Sin asignar "+b.unassigned);}
    return '<div style="margin:12px 0"><div style="display:flex;justify-content:space-between;gap:8px"><strong>'+esc(f)+'</strong><span class="muted">'+b.total+' partido(s)</span></div><div class="bar" aria-hidden="true">'+segs+'</div><div class="hint" style="margin-top:4px">'+esc(parts.join(" · "))+'</div></div>';
  }).join("")||'<p class="muted">Sin datos.</p>')+'</div>';
  h+=coverageBlock(d);
  h+=econSection();
  return h;
}

document.addEventListener("change",function(e){
  var t=e.target,ds=t.dataset||{};
  if(ds.draft){
    var k=ds.draft;S.draft[k]=t.value;
    if(k==="cat"){S.draft.home="";S.draft.away="";}
    if(k==="home"){
      var tm=S.catalog.teams.filter(function(x){return x.name===t.value;})[0],hf=tm&&tm.home&&tm.home[dr("cat","")];
      if(hf&&!dr("field",""))S.draft.field=hf;
    }
    if(k==="cat"||k==="home"||k==="field")render();
    return;
  }
  if(ds.flt){if(ds.flt==="field")S.fltField=t.value;else S.fltCat=t.value;render();return;}
  if(ds.sel==="foto"){S.selFoto=t.value;render();return;}
  if(t.id==="csvcat"&&isAdmin()){
    var f=t.files&&t.files[0];if(!f)return;
    var r=new FileReader();
    r.onload=function(){S.catMsg=importCatalog(r.result,(document.getElementById("csvmode")||{}).value);save();render();};
    r.readAsText(f,"utf-8");
    return;
  }
  if(ds.cg&&isAdmin()){
    var p=ds.cg.split("|"),kind=p[0],i=+p[1],c=S.catalog;
    if(kind==="fieldName"){
      var nv=t.value.trim(),old=c.fields[i]&&c.fields[i].name;
      if(!nv||!old){render();return;}
      c.teams.forEach(function(tm){Object.keys(tm.home||{}).forEach(function(cat){if(tm.home[cat]===old)tm.home[cat]=nv;});});
      c.fields[i].name=nv;save();render();
    }else if(kind==="fieldMaps"){
      var v=t.value.trim();
      if(v&&!linkOk(v)){alert("La liga debe empezar con http:// o https://");render();return;}
      c.fields[i].maps=v;save();
    }else if(kind==="teamCat"){
      var cat=p[2],tm2=c.teams[i];
      if(!tm2.cats.length)tm2.cats=c.cats.slice();
      var ix=tm2.cats.indexOf(cat);
      if(t.checked&&ix<0)tm2.cats.push(cat);
      if(!t.checked&&ix>=0){tm2.cats.splice(ix,1);if(tm2.home)delete tm2.home[cat];}
      save();render();
    }else if(kind==="teamHome"){
      var tm3=c.teams[i];tm3.home=tm3.home||{};
      if(t.value)tm3.home[p[2]]=t.value;else delete tm3.home[p[2]];
      save();
    }
  }
});

/* ===== Archivado automático de partidos vencidos ===== */
function act(){return S.matches.filter(function(m){return !m.archived;});}
function hasCov(m){return !!(m.cov&&((Number(m.cov.players)||0)>0||m.cov.all));}
function maxDate(a,b){return a>b?a:b;}

/* Misma regla que la función de la base de datos (se usa en la versión de muestra) */
function archiveLocal(dry,force){
  var today=todayStr(),items=[],nA=0,nW=0;
  if(!dry&&!force&&!S.cfg.autoArchive)return {skipped:true,archived:0,warned:0,items:[]};
  S.matches.forEach(function(m){
    if(m.archived||m.keep||m.date>=today)return;
    var prot=(m.cobros||[]).length>0||!!m.link||!!m.stage||hasCov(m);
    if(prot)return;
    var who=[m.f1,m.f2].filter(Boolean);
    if(!who.length){
      if(m.resId){
        if(!m.resWarned){
          items.push({id:m.id,teams:m.teams,date:m.date,action:"avisar_admin"});nW++;
          if(!dry){notify(idsAdmin(),"Partido de una reservación de cliente sin fotógrafo: "+m.teams+" ("+fmtDate(m.date)+")");m.resWarned=true;}
        }
      }else{
        items.push({id:m.id,teams:m.teams,date:m.date,action:"archivar",reason:"sin_fotografo"});nA++;
        if(!dry){m.archived=true;m.archivedAt=today;m.archivedReason="sin_fotografo";}
      }
      return;
    }
    if(!m.warnedAt){
      var deadline=maxDate(addDays(m.date,3),addDays(today,2));
      items.push({id:m.id,teams:m.teams,date:m.date,action:"avisar",archiveOn:deadline});nW++;
      if(!dry){
        m.warnedAt=today;m.archiveOn=deadline;
        notify(who.concat(idsAdmin()),"Registra la cobertura de "+m.teams+" ("+fmtDate(m.date)+"). Si no la registras, el partido se archivará el "+fmtDate(deadline)+".");
      }
    }else if(m.archiveOn&&m.archiveOn<=today){
      items.push({id:m.id,teams:m.teams,date:m.date,action:"archivar",reason:"sin_cobertura"});nA++;
      if(!dry){
        m.archived=true;m.archivedAt=today;m.archivedReason="sin_cobertura";
        notify(who.concat(idsAdmin()),"Se archivó "+m.teams+" ("+fmtDate(m.date)+") por no tener cobertura registrada.");
      }
    }
  });
  return {skipped:false,dry:!!dry,archived:nA,warned:nW,items:items};
}
function archSummary(r){
  if(r.skipped)return '<div class="hint">El archivado automático está apagado. Usa "Archivar ahora" para correrlo una sola vez.</div>';
  var lab={avisar:"Se avisará al fotógrafo",archivar:"Se archivará",avisar_admin:"Solo se te avisará (reservación de cliente sin fotógrafo)"};
  var h='<div class="hint">'+(r.dry?"Vista previa: ":"Resultado: ")+r.archived+" partido(s) por archivar y "+r.warned+' aviso(s).</div>';
  (r.items||[]).forEach(function(i){
    var why=i.reason==="sin_fotografo"?" (nadie lo tomó)":(i.reason==="sin_cobertura"?" (sin cobertura)":"");
    h+='<div class="pl"><span>'+esc(i.teams)+' <span class="muted">· '+fmtDate(i.date)+'</span></span><strong>'+(lab[i.action]||esc(i.action))+why+(i.archiveOn?" · el "+fmtDate(i.archiveOn):"")+'</strong></div>';
  });
  if(!(r.items||[]).length)h+='<div class="hint">No hay nada que archivar por ahora.</div>';
  return h;
}
function archErr(e){
  return (e&&(e.status===404||(e.body&&e.body.code==="PGRST202")))?'<div class="err">Falta ejecutar el script SQL más reciente (no existe la función de archivado).</div>':'<div class="err">No se pudo completar: '+esc(e&&e.message?e.message:"error")+'</div>';
}

/* Economía */
function splitPay(x){var l=0,b=0;(x.lines||[]).forEach(function(z){l+=z.amount;});(x.bonus||[]).forEach(function(z){b+=z.amount;});return {l:l,b:b};}
function econMonth(ym){
  var r={ing_part:0,ing_tienda:0,por_cobrar:0,sueldos:0,bonos:0,estim:0,gastos:0,cats:{},ingresos:0,egresos:0,ganancia:0,bruto_part:0,descuentos:0,excedente:0};
  S.matches.forEach(function(m){
    if(m.cov&&m.date.slice(0,7)===ym){var tt=total(m.cov),p=Number(m.cov.paid)||0;r.bruto_part+=brutoCobertura(m.cov);r.descuentos+=descuentoCobertura(m.cov);r.ing_part+=p;r.por_cobrar+=Math.max(0,tt-p);r.excedente+=Math.max(0,p-tt);}
  });
  S.orders.forEach(function(o){if((o.status==="pagado"||o.status==="entregado")&&o.date.slice(0,7)===ym)r.ing_tienda+=Number(o.total)||0;});
  var weeks=monthWeeks(ym);
  Object.keys(S.pays).forEach(function(k){
    var w=k.split("|")[1];
    if(weeks.indexOf(w)>=0){var sp=splitPay(S.pays[k]);r.sueldos+=sp.l;r.bonos+=sp.b;}
  });
  weeks.forEach(function(w){
    payeesForWeek(w).forEach(function(u){if(!S.pays[payKey(u.id,w)])r.estim+=grossOf(calcPay(u,w));});
  });
  S.expenses.forEach(function(x){
    if(x.status==="aprobado"&&x.date.slice(0,7)===ym){var a=Number(x.amount)||0;r.gastos+=a;r.cats[x.cat]=(r.cats[x.cat]||0)+a;}
  });
  r.ingresos=r.ing_part+r.ing_tienda;r.egresos=r.sueldos+r.bonos+r.gastos;r.ganancia=r.bruto_part-r.descuentos-r.por_cobrar+r.excedente+r.ing_tienda-r.egresos;
  return r;
}
function econMonths(){
  if(S.statsMonth)return [S.statsMonth];
  var cur=todayStr().slice(0,7),min=cur;
  S.matches.forEach(function(m){if(m.date&&m.date.slice(0,7)<min)min=m.date.slice(0,7);});
  S.orders.forEach(function(o){if(o.date&&o.date.slice(0,7)<min)min=o.date.slice(0,7);});
  S.expenses.forEach(function(x){if(x.date&&x.date.slice(0,7)<min)min=x.date.slice(0,7);});
  var out=[],i=0;
  while(min<=cur&&i<48){out.push(min);var p=min.split("-"),y=+p[0],m=+p[1];m++;if(m>12){m=1;y++;}min=y+"-"+pad(m);i++;}
  return out;
}
function econTotal(months){
  var t={ing_part:0,ing_tienda:0,por_cobrar:0,sueldos:0,bonos:0,estim:0,gastos:0,cats:{},ingresos:0,egresos:0,ganancia:0,bruto_part:0,descuentos:0,excedente:0};
  months.forEach(function(ym){
    var r=econMonth(ym);
    ["ing_part","ing_tienda","por_cobrar","sueldos","bonos","estim","gastos","ingresos","egresos","ganancia","bruto_part","descuentos","excedente"].forEach(function(k){t[k]+=r[k];});
    Object.keys(r.cats).forEach(function(c){t.cats[c]=(t.cats[c]||0)+r.cats[c];});
  });
  return t;
}
function monthLabel(ym){var p=ym.split("-");return MONTHS[+p[1]-1].slice(0,3)+" "+p[0].slice(2);}
function econSection(){
  var months=econMonths(),t=econTotal(months);
  var period=S.statsMonth?monthLabel(S.statsMonth):"todo el tiempo";
  var h='<div class="card"><h3>Economía del negocio</h3><p class="muted" style="margin-top:0">Periodo: '+period+'. Ventas brutas menos descuentos a clientes y saldos pendientes, más cobros extra, menos sueldos, bonos y gastos aprobados.</p>'+
  '<div class="num" style="color:'+(t.ganancia<0?"var(--alert)":"var(--ok)")+'">'+money(t.ganancia)+'</div><div>Ganancia real</div></div>';
  h+='<div class="grid2" style="margin:14px 0"><div class="card"><div class="num">'+money(t.ingresos)+'</div>Ingresos cobrados<div class="hint">Partidos '+money(t.ing_part)+' · Tienda '+money(t.ing_tienda)+'</div></div>'+
  '<div class="card"><div class="num">'+money(t.egresos)+'</div>Egresos<div class="hint">Sueldos '+money(t.sueldos)+' · Bonos '+money(t.bonos)+' · Gastos '+money(t.gastos)+'</div></div>'+
  '<div class="card"><div class="num" style="color:var(--alert)">−'+money(t.descuentos)+'</div>Descuentos otorgados a clientes<div class="hint">Reducen el ingreso bruto; no se cuentan dos veces.</div></div>'+
  '<div class="card"><div class="num">'+money(t.bruto_part)+'</div>Venta bruta de partidos<div class="hint">Antes de descuentos y cobros pendientes.</div></div>'+
  '<div class="card"><div class="num">'+money(t.por_cobrar)+'</div>Por cobrar a clientes</div>'+
  '<div class="card"><div class="num">'+money(t.estim)+'</div>Sueldos por aprobar<div class="hint">Estimado; aún no cuenta como egreso.</div></div></div>';
  // Tendencia de los últimos 6 meses
  var endYm=S.statsMonth||todayStr().slice(0,7),tm=[],p=endYm.split("-"),y=+p[0],mo=+p[1];
  for(var i=0;i<6;i++){tm.unshift(y+"-"+pad(mo));mo--;if(mo<1){mo=12;y--;}}
  var rows=tm.map(function(ym){return {ym:ym,r:econMonth(ym)};});
  var mx=0;rows.forEach(function(x){mx=Math.max(mx,x.r.ingresos,x.r.egresos);});
  h+='<div class="card"><h3>Ingresos y egresos por mes</h3><p class="muted" style="margin-top:0">Últimos 6 meses. Verde: ingresos. Rojo: egresos.</p>'+
  rows.map(function(x){
    return '<div style="margin:12px 0"><div style="display:flex;justify-content:space-between;gap:8px"><strong style="text-transform:capitalize">'+monthLabel(x.ym)+'</strong><span class="muted">Ganancia '+money(x.r.ganancia)+'</span></div>'+
    '<div class="bar" aria-hidden="true" style="margin-top:4px"><i style="width:'+(mx?Math.round(x.r.ingresos/mx*100):0)+'%;background:var(--ok)"></i></div>'+
    '<div class="bar" aria-hidden="true" style="margin-top:3px"><i style="width:'+(mx?Math.round(x.r.egresos/mx*100):0)+'%;background:var(--alert)"></i></div>'+
    '<div class="hint" style="margin-top:3px">Ingresos cobrados '+money(x.r.ingresos)+' · Descuentos −'+money(x.r.descuentos)+' · Egresos '+money(x.r.egresos)+'</div></div>';
  }).join("")+'</div>';
  // En qué se gasta
  var parts=[["Sueldos",t.sueldos],["Bonos",t.bonos]];
  Object.keys(t.cats).sort(function(a,b){return t.cats[b]-t.cats[a];}).forEach(function(c){parts.push(["Gastos: "+c,t.cats[c]]);});
  parts=parts.filter(function(x){return x[1]>0;});
  h+='<div class="card"><h3>En qué se gasta</h3><p class="muted" style="margin-top:0">Reparto de los egresos del periodo.</p>'+
  (parts.map(function(x,i){return barRow(x[0],x[1],t.egresos,PALETTE[i%PALETTE.length],money(x[1])+" ("+(t.egresos?Math.round(x[1]/t.egresos*100):0)+"%)");}).join("")||'<p class="muted">Sin egresos en el periodo.</p>')+'</div>';
  return h;
}
function buildEconCsv(){
  var cats=EXP_CATS.slice().concat(["Costos directos de cobertura"]),months=econMonths();
  var head=["Mes","Ingresos por partidos","Ingresos de la tienda","Ingresos totales","Sueldos","Bonos","Gastos aprobados"].concat(cats.map(function(c){return "Gastos: "+c;})).concat(["Egresos totales","Ganancia real","Por cobrar a clientes","Sueldos por aprobar (estimado)","Ventas brutas de partidos","Descuentos otorgados a clientes"]);
  var rows=[head];

function tiPerformance(){var state=TI.state,saved=tsi11Latest(state.estimates,function(e){return e.match_id;}),closed=Object.values(saved).filter(function(e){return e.data.players_total>0&&e.data.players_done===e.data.players_total;}),minutes=0,players=0,ontime=0,errors=[];closed.forEach(function(e){var recorded=state.sessions.filter(function(s){return s.match_id===e.match_id&&s.kind==='original'&&s.status!=='active';}).reduce(function(n,s){return n+Number(s.active_seconds)/60;},0);if(recorded>0){minutes+=recorded;players+=e.data.players_total;}var versions=state.estimates.filter(function(x){return x.match_id===e.match_id;}).sort(function(a,b){return a.version-b.version;}),finish=versions.find(function(x){return x.data.players_done===x.data.players_total&&x.data.players_total>0;});if(finish&&new Date(finish.created_at)<=new Date(finish.data.deadline))ontime++;var baseline=versions.find(function(x){return x.data.players_done===0&&x.data.manual_minutes_per_player>0;});if(baseline&&recorded>0){var estimate=baseline.data.players_total*baseline.data.manual_minutes_per_player;errors.push(Math.abs(recorded-estimate)/recorded*100);}});return '<div class="ti-metrics">'+tiMetric('Minutos originales por jugador',players?(minutes/players).toFixed(1):'Sin historial')+tiMetric('Terminados a tiempo (según avance registrado)',closed.length?ontime+'/'+closed.length:'Sin registros')+tiMetric('Error absoluto medio de estimación',errors.length?(errors.reduce(function(n,x){return n+x;},0)/errors.length).toFixed(0)+' %':'Sin comparaciones')+'</div><p class="hint">Los indicadores solo usan trabajos con avance completo registrado y tiempos medidos. No equivalen a comprobar recepción de archivos por el cliente.</p>';}

          if(await permission!=='granted')throw new Error('No se autorizó el permiso. Puedes revisarlo en los ajustes del dispositivo.');
